<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur de synthèse client</title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3B4694">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Synthèse CF">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#3B4694;
    --navy-dark:#262F66;
    --lavande:#E3E6FF;
    --bronze:#AB7852;
    --cream:#FAF9FF;
    --ink:#1c1c28;
    --line:#dfe1f5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--cream);
    color:var(--ink);
    padding-bottom:100px;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:20px 20px 18px;
    position:sticky;
    top:0;
    z-index:10;
  }
  header h1{ margin:0; font-size:18px; font-weight:700; }
  header p{ margin:4px 0 0; font-size:12px; color:#c9cdf5; }
  .wrap{ max-width:660px; margin:0 auto; padding:16px; }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--navy);
    margin:0 0 12px;
    font-weight:700;
  }
  .seg{ display:flex; gap:8px; flex-wrap:wrap; }
  .seg-btn{
    flex:1;
    min-width:100px;
    padding:12px 8px;
    border-radius:11px;
    border:1.5px solid var(--line);
    background:var(--cream);
    text-align:center;
    font-size:13px;
    font-weight:600;
    color:var(--navy);
    cursor:pointer;
  }
  .seg-btn.active{ border-color:var(--navy); background:var(--navy); color:#fff; }
  label.fl{ display:block; font-size:11.5px; color:#71718a; margin:10px 0 4px; font-weight:600; }
  input[type=text], input[type=number]{
    width:100%;
    padding:10px 11px;
    border-radius:9px;
    border:1.5px solid var(--line);
    font-size:14.5px;
    background:#fff;
    color:var(--ink);
  }
  input:focus{ outline:none; border-color:var(--bronze); }
  .row-block{
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-top:12px;
    background:var(--cream);
    position:relative;
  }
  .row-block .rm{
    position:absolute; top:8px; right:10px;
    font-size:12px; color:#b23; cursor:pointer; font-weight:700;
  }
  .row-name input{ font-weight:700; color:var(--navy); }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
  .field-grid.full{ grid-template-columns:1fr; }
  .unit-hint{ font-size:10.5px; color:#a3a3b5; margin-top:2px; }
  .add-btn{
    margin-top:12px;
    width:100%;
    padding:11px;
    border-radius:10px;
    border:1.5px dashed var(--navy);
    background:none;
    color:var(--navy);
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .footer-bar{
    position:fixed; bottom:0; left:0; right:0;
    background:#fff; border-top:1px solid var(--line);
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; z-index:20;
  }
  .generate-btn{
    max-width:660px; width:100%;
    background:var(--navy); color:#fff; border:none;
    padding:15px; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer;
  }
  .badge{
    display:inline-block; padding:3px 9px; border-radius:999px;
    background:var(--lavande); color:var(--navy); font-size:11px; font-weight:700;
  }
</style>
</head>
<body>

<header>
  <h1>Générateur de synthèse client</h1>
  <p id="subhint">Choisis l'argumentaire pour commencer</p>
</header>

<div class="wrap">

  <div class="card">
    <h2>1. Argumentaire</h2>
    <div class="seg" id="argSeg"></div>
  </div>

  <div class="card">
    <h2>2. Type de document</h2>
    <div class="seg" id="typeSeg"></div>
  </div>

  <div class="card">
    <h2>Informations générales</h2>
    <label class="fl">Titre du document</label>
    <input type="text" id="docTitle">
    <label class="fl">Nom / Prénom du client</label>
    <input type="text" id="clientName" placeholder="Ex. M. et Mme Dupont">
    <div id="horizonWrap" style="display:none;">
      <label class="fl">Horizon (années)</label>
      <input type="number" id="horizon" value="10">
    </div>
  </div>

  <div id="formArea"></div>

</div>

<div class="footer-bar">
  <button class="generate-btn" onclick="generatePDF()">Générer le PDF</button>
</div>

<script>
/* ---------------- CONFIG ---------------- */

const ARGS = [
  {key:'enrichissement', label:'Enrichissement'},
  {key:'retraite',       label:'Retraite'},
  {key:'transmission',   label:'Transmission'}
];
const TYPES = [
  {key:'solution',  label:'Solution chiffrée'},
  {key:'triptyque', label:'Triptyque'}
];

const TRAMES = {
  enrichissement: {
    docTitle: 'Solution chiffrée – Enrichissement',
    solution: {
      columns: [
        {key:'solution', label:'Solution', type:'text', placeholder:'200€ / mois'},
        {key:'capital',  label:'Capital à {horizon} ans', type:'number', unit:'€'},
        {key:'retraite', label:'Retraite', type:'compound', sub:[
          {key:'capital', label:'Capital', unit:'€'},
          {key:'rente',   label:'Rente', unit:'€ / mois'}
        ]}
      ]
    },
    triptyque: { kind:'percent3', docTitle:'Triptyque – Enrichissement' }
  },
  retraite: {
    docTitle: 'Solution chiffrée – Retraite',
    solution: {
      columns: [
        {key:'aujourdhui', label:"Aujourd'hui", type:'text', placeholder:'500€ / mois ou 32 000€'},
        {key:'capitalRetraite', label:'Capital à la retraite', type:'number', unit:'€'},
        {key:'revenus', label:'Revenus complémentaires', type:'number', unit:'€ / mois'}
      ]
    },
    triptyque: { kind:'percent3', docTitle:'Triptyque – Retraite' }
  },
  transmission: {
    docTitle: 'Solution chiffrée – Transmission',
    solution: {
      columns: [
        {key:'solution', label:'Solution', type:'text', placeholder:'200€ / mois'},
        {key:'retraite', label:'Retraite', type:'compound', sub:[
          {key:'capital', label:'Capital', unit:'€'},
          {key:'rente',   label:'Rente', unit:'€ / mois'}
        ]}
      ],
      globalField: {key:'economie', label:'Économie frais de succession', unit:'€'}
    },
    triptyque: { kind:'banqueVsCap', docTitle:'Triptyque – Transmission' }
  }
};

/* ---------------- STATE ---------------- */

let arg = 'enrichissement';
let docType = 'solution';

let rows = [ makeRow('Assurance vie'), makeRow('PER') ];
let globalValue = '';

let percentRows = [
  {desc:'Solution 1 : ', percent:'60'},
  {desc:'Solution 2 : ', percent:'80'},
  {desc:'Solution 3 : IDEALE', percent:'IDEALE'}
];

let bvcRows = [
  {banque:'', cap:'', eco:''},
  {banque:'', cap:'', eco:''},
  {banque:'', cap:'', eco:''}
];

function makeRow(name){ return { label:name, values:{}, ecoIR:'' }; }

/* ---------------- INIT UI ---------------- */

function buildSeg(container, items, activeKey, onClick){
  container.innerHTML = '';
  items.forEach(it=>{
    const d = document.createElement('div');
    d.className = 'seg-btn' + (it.key===activeKey ? ' active':'');
    d.textContent = it.label;
    d.onclick = ()=>onClick(it.key);
    container.appendChild(d);
  });
}

function refreshTopSegs(){
  buildSeg(document.getElementById('argSeg'), ARGS, arg, k=>{ arg = k; onArgOrTypeChange(); });
  buildSeg(document.getElementById('typeSeg'), TYPES, docType, k=>{ docType = k; onArgOrTypeChange(); });
}

function onArgOrTypeChange(){
  refreshTopSegs();
  const cfg = TRAMES[arg];
  document.getElementById('docTitle').value = docType==='solution' ? cfg.docTitle : cfg.triptyque.docTitle;
  document.getElementById('horizonWrap').style.display = (arg==='enrichissement' && docType==='solution') ? 'block' : 'none';
  document.getElementById('subhint').textContent = ARGS.find(a=>a.key===arg).label + ' — ' + TYPES.find(t=>t.key===docType).label;
  renderForm();
}

/* ---------------- FORM RENDERING ---------------- */

function renderForm(){
  const area = document.getElementById('formArea');
  area.innerHTML = '';

  if(docType==='solution'){
    renderSolutionForm(area);
  } else {
    const kind = TRAMES[arg].triptyque.kind;
    if(kind==='percent3') renderPercent3Form(area);
    else renderBvcForm(area);
  }
}

function renderSolutionForm(area){
  const cfg = TRAMES[arg].solution;
  const card = document.createElement('div');
  card.className = 'card';
  let html = '<h2>Produits</h2>';
  card.innerHTML = html;

  rows.forEach((row, i)=>{
    const block = document.createElement('div');
    block.className = 'row-block';
    let inner = `<span class="rm" onclick="removeRow(${i})">✕</span>
      <div class="row-name"><label class="fl">Produit</label>
      <input type="text" value="${row.label}" oninput="rows[${i}].label=this.value"></div>`;

    cfg.columns.forEach(col=>{
      const label = col.label.replace('{horizon}', document.getElementById('horizon') ? (document.getElementById('horizon').value||'10') : '10');
      if(col.type==='text'){
        const v = row.values[col.key] || '';
        inner += `<label class="fl">${label}</label>
          <input type="text" value="${v}" placeholder="${col.placeholder||''}"
            oninput="rows[${i}].values['${col.key}']=this.value">`;
      } else if(col.type==='number'){
        const v = row.values[col.key] || '';
        inner += `<label class="fl">${label} (${col.unit})</label>
          <input type="text" inputmode="decimal" value="${v}"
            oninput="rows[${i}].values['${col.key}']=this.value">`;
      } else if(col.type==='compound'){
        inner += `<label class="fl">${label}</label><div class="field-grid">`;
        col.sub.forEach(s=>{
          const key = col.key + '_' + s.key;
          const v = row.values[key] || '';
          inner += `<div><input type="text" inputmode="decimal" value="${v}" placeholder="${s.label}"
            oninput="rows[${i}].values['${key}']=this.value">
            <div class="unit-hint">${s.label} (${s.unit})</div></div>`;
        });
        inner += '</div>';
      }
    });

    inner += `<label class="fl">Éco. impôt / défiscalisation — optionnel (ex. PER)</label>
      <input type="text" inputmode="decimal" value="${row.ecoIR||''}" placeholder="Ex. 540"
        oninput="rows[${i}].ecoIR=this.value">
      <div class="unit-hint">€ / an — affiché en petit badge sur le PDF si rempli</div>`;

    block.innerHTML = inner;
    card.appendChild(block);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn';
  addBtn.textContent = '+ Ajouter un produit';
  addBtn.onclick = ()=>{ rows.push(makeRow('Nouveau produit')); renderForm(); };
  card.appendChild(addBtn);

  area.appendChild(card);

  if(cfg.globalField){
    const gCard = document.createElement('div');
    gCard.className = 'card';
    gCard.innerHTML = `<h2>${cfg.globalField.label}</h2>
      <label class="fl">Montant (${cfg.globalField.unit})</label>
      <input type="text" inputmode="decimal" value="${globalValue}" oninput="globalValue=this.value">`;
    area.appendChild(gCard);
  }
}

function removeRow(i){ rows.splice(i,1); renderForm(); }

function renderPercent3Form(area){
  const card = document.createElement('div');
  card.className = 'card';
  let html = "<h2>3 solutions (% du dernier revenu d'activité atteint)</h2>";
  card.innerHTML = html;

  percentRows.forEach((r,i)=>{
    const block = document.createElement('div');
    block.className = 'row-block';
    block.innerHTML = `
      <label class="fl">Description de la solution ${i+1}</label>
      <input type="text" value="${r.desc}" placeholder="Ex. 3000€ + 50€/mois"
        oninput="percentRows[${i}].desc=this.value">
      <label class="fl">% du dernier revenu atteint (ou "IDEALE")</label>
      <input type="text" value="${r.percent}" placeholder="Ex. 60 ou IDEALE"
        oninput="percentRows[${i}].percent=this.value">`;
    card.appendChild(block);
  });

  area.appendChild(card);
}

function renderBvcForm(area){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<h2>3 répartitions — Banque vs Capfinances</h2>';

  bvcRows.forEach((r,i)=>{
    const block = document.createElement('div');
    block.className = 'row-block';
    block.innerHTML = `
      <label class="fl">Répartition ${i+1}</label>
      <div class="field-grid">
        <div><label class="fl">Banque (€)</label>
          <input type="text" inputmode="decimal" value="${r.banque}" oninput="bvcRows[${i}].banque=this.value"></div>
        <div><label class="fl">Capfinances (€)</label>
          <input type="text" inputmode="decimal" value="${r.cap}" oninput="bvcRows[${i}].cap=this.value"></div>
      </div>
      <label class="fl">Économie frais de succession (%)</label>
      <input type="text" value="${r.eco}" placeholder="Ex. 25%"
        oninput="bvcRows[${i}].eco=this.value">`;
    card.appendChild(block);
  });

  area.appendChild(card);
}

/* ---------------- PDF GENERATION ---------------- */

const NAVY = [59,70,148];
const NAVY_DARK = [38,47,102];
const LAV = [227,230,255];
const BRONZE = [190,152,116];
const WHITE = [255,255,255];

function parseNum(v){
  if(v===undefined||v===null) return NaN;
  const cleaned = String(v).replace(/[^\d,.\-]/g,'').replace(',', '.');
  if(cleaned==='' || cleaned==='-') return NaN;
  return parseFloat(cleaned);
}

function fmt(v){
  const n = parseNum(v);
  if(v===''||v===undefined||v===null||isNaN(n)) return '—';
  const rounded = Math.round(n);
  return String(rounded).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function drawTopHeader(doc, client, pageW){
  doc.setFillColor(...NAVY);
  doc.rect(0,0,pageW,24,'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(17);
  doc.setTextColor(...WHITE);
  doc.text(client || 'Client', 14, 15);
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.setTextColor(220,222,250);
  doc.text('Capfinances', pageW-14, 15, {align:'right'});
}

function generatePDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4', orientation:'landscape'});
  const pageW = doc.internal.pageSize.getWidth();
  const title = document.getElementById('docTitle').value || 'Synthèse';
  const client = document.getElementById('clientName').value;
  const horizon = document.getElementById('horizon') ? (document.getElementById('horizon').value||'10') : '10';

  drawTopHeader(doc, client, pageW);

  if(docType==='solution'){
    drawSolutionPDF(doc, pageW, horizon);
  } else {
    const kind = TRAMES[arg].triptyque.kind;
    if(kind==='percent3') drawPercent3PDF(doc, pageW);
    else drawBvcPDF(doc, pageW);
  }

  doc.setFont('helvetica','normal');
  doc.setFontSize(7.5);
  doc.setTextColor(150,150,150);
  doc.text('Document non contractuel — simulation à titre indicatif.', 14, doc.internal.pageSize.getHeight()-8);

  const argLabel = ARGS.find(a=>a.key===arg).label;
  const typeLabel = docType==='solution' ? 'Solution' : 'Triptyque';
  const clientPart = (client||'Client').trim().replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_-]/g,'');
  const fname = [clientPart, argLabel, typeLabel].join('_').toLowerCase();
  doc.save(fname + '.pdf');
}

function drawSolutionPDF(doc, pageW, horizon){
  const cfg = TRAMES[arg].solution;
  const marginX = 16;
  const width = pageW - marginX*2;
  let y = 34;

  // column header labels
  doc.setFont('helvetica','bold');
  doc.setFontSize(9.5);
  doc.setTextColor(...NAVY);
  const labelColW = 52;
  const restW = width - labelColW;
  const colW = restW / cfg.columns.length;
  cfg.columns.forEach((col,i)=>{
    const lbl = col.label.replace('{horizon}', horizon);
    doc.text(lbl, marginX + labelColW + i*colW, y-2, {maxWidth:colW-6});
  });
  y += 5;

  const totals = {};
  const rowH = 20;

  rows.forEach((row, ri)=>{
    doc.setFillColor(...LAV);
    doc.roundedRect(marginX, y, width, rowH, 2, 2, 'F');

    doc.setFont('helvetica','bold');
    doc.setFontSize(11.5);
    doc.setTextColor(...NAVY);
    doc.text(row.label || ('Produit '+(ri+1)), marginX+5, y+rowH/2+1.5, {maxWidth:labelColW-8});

    cfg.columns.forEach((col,i)=>{
      const x = marginX + labelColW + i*colW;
      if(col.type==='text'){
        const v = row.values[col.key] || '—';
        doc.setFont('helvetica','italic');
        doc.setFontSize(11.5);
        doc.setTextColor(...NAVY);
        doc.text(String(v), x, y+rowH/2+1.5, {maxWidth:colW-6});
      } else if(col.type==='number'){
        const v = row.values[col.key];
        totals[col.key] = (totals[col.key]||0) + (parseNum(v)||0);
        doc.setFont('helvetica','italic');
        doc.setFontSize(11.5);
        doc.setTextColor(...NAVY);
        doc.text(fmt(v) + (v!==''&&v!==undefined?' '+col.unit:''), x, y+rowH/2+1.5, {maxWidth:colW-6});
      } else if(col.type==='compound'){
        // stacked vertically: capital on top, rente below
        let sy = y + 7.5;
        col.sub.forEach(s=>{
          const key = col.key+'_'+s.key;
          const v = row.values[key];
          totals[key] = (totals[key]||0) + (parseNum(v)||0);
          doc.setFont('helvetica','bold');
          doc.setFontSize(10.5);
          doc.setTextColor(...NAVY_DARK);
          doc.text(fmt(v) + (v!==''&&v!==undefined?' '+s.unit:''), x, sy, {maxWidth:colW-6});
          sy += 7;
        });
      }
    });

    // Éco IR badge (only when filled) — overlaps bottom edge of the row, like a tooltip
    if(row.ecoIR){
      const badgeText = 'Éco IR : ' + fmt(row.ecoIR) + '€/an';
      doc.setFont('helvetica','bold');
      doc.setFontSize(8);
      const bw = doc.getTextWidth(badgeText) + 8;
      const bx = marginX + labelColW + 4;
      const by = y + rowH - 4;
      doc.setFillColor(...BRONZE);
      doc.roundedRect(bx, by, bw, 8, 2, 2, 'F');
      doc.setTextColor(...WHITE);
      doc.text(badgeText, bx + bw/2, by + 5.5, {align:'center'});
    }

    y += rowH + (row.ecoIR ? 8 : 5);
  });

  // total row
  doc.setFillColor(...BRONZE);
  doc.roundedRect(marginX, y, width, rowH, 2, 2, 'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(11.5);
  doc.setTextColor(...WHITE);
  doc.text('Total', marginX+5, y+rowH/2+1.5);

  cfg.columns.forEach((col,i)=>{
    const x = marginX + labelColW + i*colW;
    if(col.type==='number'){
      doc.setFont('helvetica','bold');
      doc.setFontSize(11.5);
      doc.text(fmt(totals[col.key]) + ' ' + col.unit, x, y+rowH/2+1.5, {maxWidth:colW-6});
    } else if(col.type==='compound'){
      let sy = y + 7.5;
      col.sub.forEach(s=>{
        const key = col.key+'_'+s.key;
        doc.setFont('helvetica','bold');
        doc.setFontSize(10.5);
        doc.text(fmt(totals[key]) + ' ' + s.unit, x, sy, {maxWidth:colW-6});
        sy += 7;
      });
    }
  });
  y += rowH + 10;

  if(cfg.globalField){
    doc.setFillColor(...LAV);
    doc.roundedRect(marginX, y, width, 20, 3, 3, 'F');
    doc.setFont('helvetica','normal');
    doc.setFontSize(10);
    doc.setTextColor(...NAVY);
    doc.text(cfg.globalField.label, marginX+6, y+8);
    doc.setFont('helvetica','bold');
    doc.setFontSize(15);
    doc.setTextColor(...BRONZE);
    doc.text(fmt(globalValue) + ' ' + cfg.globalField.unit, marginX+6, y+16);
  }
}

function drawPercent3PDF(doc, pageW){
  const marginX = 16;
  const width = pageW - marginX*2;
  let y = 34;

  percentRows.forEach((r,i)=>{
    const rowH = 20;
    doc.setFillColor(...(i%2===0? LAV : WHITE));
    if(i%2!==0){ doc.setDrawColor(...LAV); doc.setLineWidth(0.4); doc.roundedRect(marginX, y, width, rowH, 2, 2, 'S'); }
    else { doc.roundedRect(marginX, y, width, rowH, 2, 2, 'F'); }

    doc.setFont('helvetica','bold');
    doc.setFontSize(12);
    doc.setTextColor(...NAVY);
    doc.text(r.desc || ('Solution ' + (i+1)), marginX+6, y+12, {maxWidth:width-55});

    const isIdeale = String(r.percent).toUpperCase().includes('IDEAL');
    doc.setFont('helvetica','bold');
    doc.setFontSize(isIdeale ? 12 : 15);
    doc.setTextColor(...(isIdeale ? BRONZE : NAVY));
    const txt = isIdeale ? 'IDÉALE' : (r.percent + ' %');
    doc.text(txt, marginX+width-6, y+12, {align:'right'});

    y += rowH + 6;
  });
}

function drawBvcPDF(doc, pageW){
  const marginX = 16;
  const width = pageW - marginX*2;
  let y = 34;
  const colW = width/3;

  // header
  doc.setFillColor(...LAV);
  doc.roundedRect(marginX, y, width, 12, 2, 2, 'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.setTextColor(...NAVY);
  doc.text('Banque', marginX+colW/2, y+8, {align:'center'});
  doc.setTextColor(...BRONZE);
  doc.text('Capfinances', marginX+colW*1.5, y+8, {align:'center'});
  doc.setTextColor(...NAVY);
  doc.text('Économie succession', marginX+colW*2.5, y+8, {align:'center', maxWidth:colW-6});
  y += 16;

  bvcRows.forEach((r,i)=>{
    const rowH = 16;
    if(i%2===0){ doc.setFillColor(...LAV); doc.roundedRect(marginX, y, width, rowH, 2, 2, 'F'); }

    doc.setFont('helvetica','bold');
    doc.setFontSize(12);
    doc.setTextColor(...NAVY);
    doc.text(fmt(r.banque) + ' €', marginX+colW/2, y+10, {align:'center'});
    doc.setTextColor(...BRONZE);
    doc.text(fmt(r.cap) + ' €', marginX+colW*1.5, y+10, {align:'center'});
    doc.setTextColor(...NAVY);
    doc.text(String(r.eco||'—'), marginX+colW*2.5, y+10, {align:'center'});

    y += rowH + 3;
  });
}

/* ---------------- BOOT ---------------- */
onArgOrTypeChange();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
