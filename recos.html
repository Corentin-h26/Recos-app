<!DOCTYPE html>
<html lang="fr">
<head>
<script>
(function(){
  try{
    var t = localStorage.getItem('recos-theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Recos</title>

<!-- PWA : installation en app sur iPhone / iPad / Mac / PC -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22303A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recos">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#F6F1E7;
    --paper-2:#EFE7D6;
    --ink:#22303A;
    --ink-soft:#5B6B72;
    --line: #D8CDB4;
    --brass:#A9782F;
    --brass-soft:#E4CE9E;
    --brass-ink:#7A5620;
    --teal:#3F6B63;
    --teal-soft:#DCE7E2;
    --rust:#AD5A3F;
    --rust-soft:#F0DBD1;
    --slate:#6B7684;
    --slate-soft:#E4E6E7;
    --surface:#fff;
    --placeholder:#A3ABA2;
    --body-glow:#fffaf0;
    --card-shadow: 0 1px 0 rgba(34,48,58,0.06), 0 6px 16px -10px rgba(34,48,58,0.35);
    --radius: 14px;
  }
  [data-theme="dark"]{
    --paper:#1B2228;
    --paper-2:#242D34;
    --ink:#EDE7D9;
    --ink-soft:#9BA7AC;
    --line:#3A444C;
    --brass:#D9B872;
    --brass-soft:#4A3D22;
    --brass-ink:#F0D9A0;
    --teal:#7FB3A8;
    --teal-soft:#243A36;
    --rust:#E08A6C;
    --rust-soft:#3E2620;
    --slate:#9AA6B0;
    --slate-soft:#2C333A;
    --surface:#242D34;
    --placeholder:#6B7680;
    --body-glow:#232C33;
    --card-shadow: 0 1px 0 rgba(0,0,0,0.2), 0 6px 16px -10px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, var(--body-glow) 0%, var(--paper) 45%),
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom: 96px;
  }
  .display{font-family:'Fraunces', serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}

  /* HEADER */
  header{
    position:sticky; top:0; z-index:30;
    background: linear-gradient(180deg, var(--paper) 70%, rgba(246,241,231,0));
    padding: calc(18px + env(safe-area-inset-top)) 16px 10px;
  }
  .brand{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px; gap:8px;
  }
  .header-actions{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .brand h1{
    font-size: 26px; font-weight:600; letter-spacing:-0.01em; margin:0;
    display:flex; align-items:baseline; gap:8px;
  }
  .brand h1 .tally{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px; font-weight:500; color:var(--ink-soft);
    background:var(--paper-2); border:1px solid var(--line);
    padding:2px 8px; border-radius:20px;
  }
  .search-wrap{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:9px 12px; box-shadow: inset 0 1px 2px rgba(34,48,58,0.04);
  }
  .search-wrap svg{flex:none; color:var(--ink-soft);}
  .search-wrap input{
    border:none; outline:none; background:transparent; width:100%;
    font-family:'IBM Plex Sans', sans-serif; font-size:15px; color:var(--ink);
  }
  .search-wrap input::placeholder{color:var(--placeholder);}

  .sort-row{
    display:flex; align-items:center; gap:8px; margin-top:8px; padding: 0 2px; flex-wrap:wrap;
  }
  .sort-label{font-size:12.5px; color:var(--ink-soft); flex:none;}
  .filter-btn{
    font-family:'IBM Plex Sans', sans-serif; font-size:12.5px; color:var(--ink);
    background:var(--paper-2); border:1px solid var(--line); border-radius:20px;
    padding:5px 10px; cursor:pointer; display:inline-flex; align-items:center; gap:4px;
  }
  .filter-btn.active{background:var(--brass-soft); color:var(--brass-ink); border-color:var(--brass-soft);}
  .filter-list{display:flex; flex-direction:column; gap:2px; max-height:52vh; overflow-y:auto; margin-top:4px;}
  .filter-item{
    display:flex; align-items:center; gap:11px; padding:11px 4px; border-top:1px solid var(--line);
    cursor:pointer; font-size:14.5px; color:var(--ink);
  }
  .filter-item:first-child{border-top:none;}
  .filter-checkbox{
    flex:none; width:20px; height:20px; border-radius:6px; border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff;
  }
  .filter-checkbox.checked{background:var(--brass); border-color:var(--brass);}
  .filter-actions{display:flex; justify-content:space-between; gap:10px; margin-top:10px;}
  .filter-actions button{
    background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline;
    cursor:pointer; font-family:'IBM Plex Sans', sans-serif; padding:4px;
  }
  #sortSelect{
    font-family:'IBM Plex Sans', sans-serif; font-size:12.5px; color:var(--ink);
    background:var(--paper-2); border:1px solid var(--line); border-radius:20px;
    padding:5px 10px; -webkit-appearance:none; appearance:none; cursor:pointer;
  }

  /* TABLEAU DE BORD */
  .dash-wrap{margin-top:10px;}
  .dash-header{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;
  }
  .dash-summary{font-size:12.5px; color:var(--ink-soft); display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;}
  .dash-summary strong{color:var(--ink); font-weight:600;}
  .dash-summary em{font-style:normal; color:var(--ink-soft);}
  .dash-summary .dash-sep{color:var(--line);}
  .dash-toggle{
    background:none; border:none; color:var(--ink-soft); font-size:12px;
    cursor:pointer; padding:2px 8px; line-height:1;
  }
  .dash-bar{
    display:flex; height:10px; border-radius:6px; overflow:hidden;
    background:var(--paper-2); border:1px solid var(--line);
  }
  .dash-seg{height:100%; cursor:pointer; transition:opacity .15s ease; min-width:2px;}
  .dash-seg:hover{opacity:0.82;}
  .dash-legend{display:flex; flex-wrap:wrap; gap:9px 14px; margin-top:9px;}
  .dash-legend-item{
    display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-soft); cursor:pointer;
  }
  .dash-legend-dot{width:8px; height:8px; border-radius:50%; flex:none;}

  /* TABS (rolodex) */
  .tabs{
    display:flex; gap:6px; overflow-x:auto; padding:14px 16px 4px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:none; display:flex; align-items:center; gap:6px;
    padding: 8px 13px 9px; border-radius: 10px 10px 4px 4px;
    font-size:13.5px; font-weight:500; color:var(--ink-soft);
    background:var(--paper-2); border:1px solid var(--line); border-bottom:3px solid var(--line);
    cursor:pointer; white-space:nowrap;
    transition: transform .12s ease;
  }
  .tab:active{transform: scale(0.97);}
  .tab .n{
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    background:rgba(34,48,58,0.08); padding:1px 6px; border-radius:20px;
  }
  .tab.active{
    background:var(--surface); color:var(--ink); border-color: var(--line);
    border-bottom:3px solid var(--brass);
    box-shadow: 0 2px 6px -2px rgba(34,48,58,0.2);
  }
  .tab.active .n{background:var(--brass-soft); color:var(--brass-ink);}

  /* LIST */
  main{padding: 8px 16px 20px;}
  .empty{
    text-align:center; padding: 60px 20px; color:var(--ink-soft);
  }
  .empty .glyph{font-size:34px; margin-bottom:10px; opacity:.5;}
  .empty .display{font-size:19px; color:var(--ink); margin-bottom:4px;}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    padding: 13px 14px; margin-bottom:10px; box-shadow: var(--card-shadow);
    display:flex; gap:12px; align-items:flex-start; cursor:pointer;
    transition: transform .1s ease;
  }
  .card:active{transform: scale(0.985);}
  .card .avatar{
    flex:none; width:40px; height:40px; border-radius:50%;
    background: var(--teal-soft); color:var(--teal);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:600; font-size:15px;
  }
  .card .body{min-width:0; flex:1;}
  .card .row1{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .card .name{font-weight:600; font-size:15.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card .ville{font-size:12px; color:var(--ink-soft); flex:none;}
  .card .profession{font-size:13px; color:var(--ink-soft); margin-top:1px;}
  .card .reco{
    font-size:12px; color:var(--brass); margin-top:5px;
    display:flex; align-items:center; gap:4px;
  }
  .card .comment{
    font-size:12.5px; color:var(--ink-soft); margin-top:5px;
    font-style:italic; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card .rappel-badge{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11.5px; font-weight:600; margin-top:6px;
    padding:3px 8px; border-radius:20px;
  }
  .card .rappel-badge.overdue{background:var(--rust-soft); color:var(--rust);}
  .card .rappel-badge.today{background:var(--brass-soft); color:var(--brass-ink);}
  .card .rappel-badge.upcoming{background:var(--slate-soft); color:var(--slate);}
  .card .call-btn{
    flex:none; width:34px; height:34px; border-radius:50%;
    background:var(--teal-soft); color:var(--teal);
    display:flex; align-items:center; justify-content:center;
    text-decoration:none;
  }

  /* FAB */
  .fab{
    position:fixed; right:18px; bottom:calc(22px + env(safe-area-inset-bottom)); z-index:40;
    width:56px; height:56px; border-radius:50%;
    background:var(--ink); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 24px -8px rgba(34,48,58,0.55);
    border:none; cursor:pointer;
  }
  .fab:active{transform:scale(0.94);}

  /* SHEET */
  .overlay{
    position:fixed; inset:0; background:rgba(34,48,58,0.42);
    z-index:9999; display:flex; align-items:flex-end;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    background:var(--paper); width:100%; max-height:92vh; overflow-y:auto;
    border-radius: 20px 20px 0 0; padding: 8px 18px 26px;
    transform: translateY(20px); transition: transform .22s ease;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
  }
  .overlay.open .sheet{transform: translateY(0);}
  .sheet-handle{
    width:38px; height:4px; border-radius:4px; background:var(--line);
    margin: 10px auto 14px;
  }
  .sheet-title{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;
  }
  .sheet-title h2{font-size:20px; margin:0; font-weight:600;}
  .sheet-title button.close{
    background:none; border:none; color:var(--ink-soft); font-size:22px; cursor:pointer;
    line-height:1; padding:4px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--ink-soft); margin-bottom:5px; font-weight:600;
  }
  .field input, .field textarea{
    width:100%; border:1px solid var(--line); background:var(--surface); border-radius:10px;
    padding:10px 12px; font-size:15px; font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink); outline:none;
  }
  .field input:focus, .field textarea:focus{border-color:var(--teal);}
  .field textarea{resize:vertical; min-height:56px;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  .status-picker{display:flex; flex-wrap:wrap; gap:6px;}
  .status-chip{
    padding:7px 11px; border-radius:20px; font-size:12.5px; font-weight:500;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer;
  }
  .status-chip.sel{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .sheet-actions{
    display:flex; gap:10px; margin-top:18px;
  }
  .btn{
    flex:1; border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:600;
    cursor:pointer; font-family:'IBM Plex Sans', sans-serif;
  }
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:active{opacity:.85;}
  .btn-danger{background:var(--rust-soft); color:var(--rust);}
  .btn-danger:active{opacity:.85;}
  .btn-ghost{background:var(--paper-2); color:var(--ink); border:1px solid var(--line);}

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-20px);
    background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:30px;
    font-size:13px; z-index:10000; opacity:0; transition: all .25s ease; pointer-events:none;
    display:flex; align-items:center; gap:10px;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
  .toast .toast-undo{
    color:var(--brass-soft); font-weight:600; text-decoration:underline; cursor:pointer;
    background:none; border:none; font-size:13px; font-family:'IBM Plex Sans', sans-serif; padding:0; flex:none;
  }

  /* PHONE (visible + cliquable) */
  .card .phone-line{
    font-size:12.5px; color:var(--teal); margin-top:4px;
    display:flex; align-items:center; gap:4px; text-decoration:none;
  }
  .field .call-inline{
    display:flex; gap:8px; align-items:center;
  }
  .field .call-inline input{flex:1;}
  .call-inline-btn{
    flex:none; width:40px; height:40px; border-radius:10px;
    background:var(--teal-soft); color:var(--teal); display:flex; align-items:center; justify-content:center;
    text-decoration:none; border:1px solid var(--line);
  }

  /* NOTIFICATIONS */
  .notif-btn{
    flex:none; width:34px; height:34px; border-radius:50%;
    background:var(--paper-2); border:1px solid var(--line); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .notif-btn.on{background:var(--brass-soft); color:var(--brass-ink); border-color:var(--brass-soft);}

  /* MENU ACTIONS */
  .action-list{display:flex; flex-direction:column; margin-top:4px;}
  .action-row{
    display:flex; align-items:center; gap:13px; width:100%;
    background:none; border:none; border-top:1px solid var(--line);
    padding:14px 4px; text-align:left; cursor:pointer; font-family:'IBM Plex Sans', sans-serif;
  }
  .action-row:first-child{border-top:none;}
  .action-row:active{background:var(--paper-2);}
  .action-icon{font-size:19px; flex:none; width:26px; text-align:center;}
  .action-text{display:flex; flex-direction:column; flex:1; min-width:0;}
  .action-label{font-size:15px; font-weight:500; color:var(--ink);}
  .action-sub{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .action-state{
    flex:none; font-size:11.5px; font-weight:600; color:var(--ink-soft);
    background:var(--paper-2); border:1px solid var(--line); border-radius:20px; padding:3px 9px;
  }
  .action-state.on{background:var(--brass-soft); color:var(--brass-ink); border-color:var(--brass-soft);}

  /* HISTORIQUE DE SUIVI */
  .history-list{
    display:flex; flex-direction:column; border:1px solid var(--line);
    border-radius:10px; overflow:hidden; background:var(--paper-2);
  }
  .history-item{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    padding:8px 12px; font-size:12.5px; border-top:1px solid var(--line);
  }
  .history-item:first-child{border-top:none;}
  .history-date{color:var(--ink-soft); flex:none; white-space:nowrap;}
  .history-transition{color:var(--ink); text-align:right;}
  .history-transition .arrow{color:var(--ink-soft); margin:0 3px;}

  /* SÉLECTION MULTIPLE */
  .card.selected{border-color:var(--brass); background:var(--brass-soft);}
  .select-dot{
    flex:none; width:22px; height:22px; border-radius:50%; border:2px solid var(--line);
    margin-top:2px; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:#fff;
  }
  .select-dot.checked{background:var(--brass); border-color:var(--brass);}
  .bulk-bar{
    position:fixed; left:16px; right:16px; bottom:16px; z-index:600;
    background:var(--ink); color:var(--paper); border-radius:16px;
    padding:10px 12px; display:none; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:0 8px 24px -8px rgba(0,0,0,0.45);
  }
  .bulk-bar.show{display:flex;}
  .bulk-cancel{
    background:none; border:none; color:var(--paper); opacity:.7; font-size:13px;
    cursor:pointer; padding:6px 4px; font-family:'IBM Plex Sans', sans-serif; flex:none;
  }
  .bulk-count{font-size:13px; font-weight:600; flex:1; text-align:center; white-space:nowrap;}
  .bulk-actions{display:flex; gap:8px; flex:none;}
  .bulk-actions .btn{padding:8px 12px; font-size:12.5px; border-radius:20px;}
  @media (min-width:780px){
    .bulk-bar{max-width:900px; left:50%; right:auto; transform:translateX(-50%);}
  }

  /* ÉCRAN DE CONNEXION */
  .login-screen{
    position:fixed; inset:0; z-index:20000; display:none;
    align-items:center; justify-content:center; padding:20px;
    background:
      radial-gradient(1200px 500px at 50% -10%, var(--body-glow) 0%, var(--paper) 45%),
      var(--paper);
  }
  .login-screen.show{display:flex;}
  .login-card{
    width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:28px 24px; box-shadow:var(--card-shadow);
    display:flex; flex-direction:column; gap:14px;
  }
  .login-card h1{margin:0; font-size:26px; text-align:center; color:var(--ink);}
  .login-sub{margin:-8px 0 4px; text-align:center; font-size:13px; color:var(--ink-soft);}
  .login-error{font-size:12.5px; color:var(--rust); min-height:16px; text-align:center;}
  .login-forgot{
    text-align:center; font-size:12.5px; color:var(--ink-soft);
    text-decoration:underline; margin-top:2px;
  }
  .login-hint{margin:-6px 0 0; font-size:11.5px; color:var(--ink-soft); text-align:center;}

  /* MAP TAB */
  #mapView{
    display:none; height: calc(100vh - 190px); min-height:400px;
    border-radius: var(--radius); overflow:hidden; border:1px solid var(--line);
    margin: 4px 16px 16px;
  }
  #mapView.active{display:block;}

  /* DOUBLONS */
  #dupesView{display:none; padding: 4px 16px 16px;}
  #dupesView.active{display:block;}
  .dupe-group{margin-bottom:20px;}
  .dupe-group-header{
    font-size:12.5px; font-weight:600; color:var(--rust); margin-bottom:8px;
    display:flex; align-items:center; gap:6px;
  }
  .dupe-group .card{border-color:var(--rust-soft); margin-bottom:8px;}
  .leaflet-popup-content{font-family:'IBM Plex Sans', sans-serif; font-size:13px;}
  .leaflet-popup-content b{font-family:'Fraunces', serif;}
  .map-popup-item{padding:3px 0; border-top:1px solid var(--line); cursor:pointer;}
  .map-popup-item:hover{background:var(--paper);}
  .map-popup-item:first-of-type{border-top:none;}

  /* RESPONSIVE : iPad / Mac (écrans larges, souris/trackpad) */
  @media (min-width: 780px){
    body{padding-bottom: 40px;}
    header{
      max-width: 900px; margin: 0 auto; padding: 24px 24px 10px;
    }
    main{max-width: 900px; margin: 0 auto; padding: 8px 24px 32px;}
    .brand h1{font-size:30px;}
    .search-wrap{padding:11px 14px;}
    .search-wrap input{font-size:16px;}
    .tabs{

<script>
// ---- CHARGEMENT DIFFÉRÉ (Leaflet et Excel ne sont chargés qu'à l'usage,
// pour que l'app démarre beaucoup plus vite) ----
const _loadedScripts = {};
function loadScriptOnce(src){
  if(_loadedScripts[src]) return _loadedScripts[src];
  _loadedScripts[src] = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return _loadedScripts[src];
}
function loadStylesheetOnce(href){
  if(document.querySelector(`link[href="${href}"]`)) return;
  const l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = href;
  document.head.appendChild(l);
}
async function ensureLeafletLoaded(){
  if(typeof L !== 'undefined') return;
  loadStylesheetOnce('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css');
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js');
}
async function ensureXLSXLoaded(){
  if(typeof XLSX !== 'undefined') return;
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
}

const STATUSES = ["Contact","Rappeler","RDV posé","R1 fait","R2 fait","R3 fait","Signé","Refus","Client perdu"];
const STATUS_COLORS = {
  "Contact":"slate", "Rappeler":"rust", "RDV posé":"teal", "R1 fait":"teal",
  "R2 fait":"teal", "R3 fait":"teal", "Signé":"brass", "Refus":"slate", "Client perdu":"slate"
};
const STATUS_HEX = {
  "Contact":"#8B95A1", "Rappeler":"#C97B5F", "RDV posé":"#D9A441",
  "R1 fait":"#7FAFA6", "R2 fait":"#4F8A80", "R3 fait":"#356F66",
  "Signé":"#A9782F", "Refus":"#B3543E", "Client perdu":"#5B6B72"
};

const SEED = []; // liste de démarrage retirée pour ne plus exposer de données clients dans le code source public

let state = {
  contacts: [],
  activeStatus: "Contact",
  search: "",
  editingId: null,
  sortMode: localStorage.getItem('recos-sort-mode') || 'rappel',
  selectMode: false,
  selectedIds: new Set(),
  filterDe: new Set(),
  filterVille: new Set()
};

function getCreatedAt(c){
  // pour les contacts créés avant cette fonctionnalité, on approxime la date
  // d'ajout via leur id (ordre d'origine du fichier), toujours plus ancien
  // que les vrais horodatages (bien plus grands) des contacts ajoutés depuis
  return c.createdAt || (c.id * 1000);
}

const STORAGE_KEY = "recos-contacts-v1"; // conservé comme clé de secours locale (hors-ligne)

// ---- FIREBASE ----
const firebaseConfig = {
  apiKey: "AIzaSyDJVvlWIaIjeY3mCaMbTofrXvKrZKBX_2g",
  authDomain: "reco-app-da0ce.firebaseapp.com",
  projectId: "reco-app-da0ce",
  storageBucket: "reco-app-da0ce.firebasestorage.app",
  messagingSenderId: "783377738587",
  appId: "1:783377738587:web:c2010bd5764282af52c87e"
};
let db = null, auth = null, docRef = null;
if(typeof firebase !== 'undefined'){
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  // active le cache local natif de Firestore (IndexedDB) : les contacts restent
  // consultables et modifiables hors-ligne, avec resynchro automatique au retour du réseau
  db.enablePersistence({synchronizeTabs: true}).catch(err=>{
    if(err.code === 'failed-precondition'){
      console.warn("Persistance hors-ligne désactivée sur cet onglet (plusieurs onglets ouverts)");
    } else if(err.code === 'unimplemented'){
      console.warn("Persistance hors-ligne non supportée par ce navigateur");
    } else {
      console.warn("Persistance hors-ligne indisponible", err);
    }
  });
  auth = firebase.auth();
}

let firestoreReady = false;
let applyingRemoteUpdate = false;
let snapshotUnsubscribe = null;

function loadData(){
  if(typeof firebase === 'undefined'){
    // le SDK Firebase n'a pas pu se charger (bloqué par le réseau/l'aperçu) :
    // on bascule directement sur la copie locale pour ne pas laisser l'écran vide
    console.error("Firebase SDK non chargé");
    showToast("Mode hors-ligne (Firebase indisponible)");
    loadLocalFallback();
    return;
  }

  auth.onAuthStateChanged(async user=>{
    if(snapshotUnsubscribe){ snapshotUnsubscribe(); snapshotUnsubscribe = null; }

    if(!user){
      state.contacts = [];
      document.getElementById('loginScreen').classList.add('show');
      return;
    }
    document.getElementById('loginScreen').classList.remove('show');
    document.getElementById('loginError').textContent = '';

    // chaque conseiller a sa propre base, isolée par son identifiant de compte
    docRef = db.collection('users').doc(user.uid).collection('data').doc('recos-data');

    await migrateLegacyDataIfNeeded(user);
    await ensureDirectoryEntry(user);
    attachInboxListener(user);

    // écoute en temps réel : toute modif sur un autre appareil arrive ici automatiquement
    snapshotUnsubscribe = docRef.onSnapshot(snap=>{
      firestoreReady = true;
      if(snap.exists && snap.data().contacts){
        applyingRemoteUpdate = true;
        state.contacts = snap.data().contacts;
        applyingRemoteUpdate = false;
        localStorage.setItem(STORAGE_KEY + '-' + user.uid, JSON.stringify(state.contacts)); // copie hors-ligne
        render();
        updateNotifBtnUI();
        checkDueNotifications();
      } else {
        // première connexion : base vierge pour ce conseiller
        state.contacts = [];
        persist();
        render();
      }
    }, err=>{
      console.error("Erreur de synchronisation Firebase", err);
      showToast("Synchronisation interrompue — mode hors-ligne");
      loadLocalFallback();
    });
  });
}

// migre une fois l'ancienne base partagée (app/recos-data) vers l'espace personnel
// du tout premier compte (Corentin) — sans effet pour les nouveaux conseillers,
// qui n'ont de toute façon pas accès à cet ancien document
async function migrateLegacyDataIfNeeded(user){
  try{
    const newSnap = await docRef.get();
    if(newSnap.exists) return; // déjà migré ou déjà en place
    const oldRef = db.collection('app').doc('recos-data');
    const oldSnap = await oldRef.get();
    if(oldSnap.exists && oldSnap.data().contacts && oldSnap.data().contacts.length){
      await docRef.set({ contacts: oldSnap.data().contacts, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      console.log("Ancienne base migrée vers l'espace personnel de", user.email);
    }
  }catch(e){
    // pas d'accès à l'ancien document (nouveau conseiller) : rien à migrer, c'est normal
  }
}

// ---- ANNUAIRE DES CONSEILLERS (pour le partage entre binômes) ----
let myDirectoryName = null;

async function ensureDirectoryEntry(user){
  try{
    const ref = db.collection('directory').doc(user.uid);
    const snap = await ref.get();
    if(snap.exists && snap.data().name){
      myDirectoryName = snap.data().name;
      return;
    }
    // compte créé avant l'introduction de l'annuaire : on demande le nom une seule fois
    let name = window.prompt("Pour activer le partage entre binômes, indique ton nom complet (Prénom NOM) :");
    name = normalizeNameFormat((name || '').trim());
    if(!name) return; // l'utilisateur peut annuler, on ne bloque pas l'app pour autant
    await ref.set({ name, nameKey: normalizeKey(name), email: user.email });
    myDirectoryName = name;
  }catch(e){
    console.warn("Annuaire indisponible", e);
  }
}

async function findAccountByName(name){
  if(!name) return null;
  const key = normalizeKey(name);
  if(!key) return null;
  try{
    const q = await db.collection('directory').where('nameKey', '==', key).limit(1).get();
    if(q.empty) return null;
    const doc = q.docs[0];
    if(doc.id === auth.currentUser.uid) return null; // on ne se partage pas un contact à soi-même
    return { uid: doc.id, name: doc.data().name };
  }catch(e){
    console.warn("Recherche annuaire impossible", e);
    return null;
  }
}

async function shareContactWithBinome(contact, deName){
  const account = await findAccountByName(deName);
  if(!account){
    return { shared:false, reason:'not_found' };
  }
  try{
    const inboxRef = db.collection('users').doc(account.uid).collection('inbox').doc();
    await inboxRef.set({
      nom: contact.nom || '', prenom: contact.prenom || '', tel: contact.tel || '',
      ville: contact.ville || '', profession: contact.profession || '',
      reco: contact.reco || '', commentaires: contact.commentaires || '',
      de: myDirectoryName || '', // vu depuis le binôme, "DE" = la personne qui partage
      sharedByName: myDirectoryName || '',
      sharedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return { shared:true, name: account.name };
  }catch(e){
    console.warn("Partage impossible", e);
    return { shared:false, reason:'error' };
  }
}

function attachInboxListener(user){
  db.collection('users').doc(user.uid).collection('inbox').onSnapshot(snap=>{
    snap.docChanges().forEach(change=>{
      if(change.type !== 'added') return;
      const data = change.doc.data();
      let nextId = state.contacts.length ? Math.max(...state.contacts.map(c=>c.id))+1 : 1;
      const newContact = {
        id: nextId,
        createdAt: Date.now(),
        nom: data.nom || '', prenom: data.prenom || '', tel: data.tel || '',
        ville: data.ville || '', profession: data.profession || '',
        reco: data.reco || '', de: data.de || '', statut: 'Contact',
        commentaires: data.commentaires || '',
        historique: [{ date: Date.now(), from: null, to: 'Contact' }]
      };
      state.contacts.push(newContact);
      persist();
      render();
      showToast(`Contact reçu de ${data.sharedByName || 'un binôme'} : ${newContact.prenom} ${newContact.nom}`);
      change.doc.ref.delete().catch(()=>{});
    });
  }, err=>{
    console.warn("Écoute de la boîte de partage impossible", err);
  });
}

// ---- CONNEXION / INSCRIPTION / DÉCONNEXION ----
const ALLOWED_EMAIL_DOMAIN = '@capfinances.fr';
let authMode = 'login'; // 'login' ou 'signup'

function updateAuthModeUI(){
  document.getElementById('loginSubmitBtn').textContent = authMode === 'signup' ? 'Créer mon compte' : 'Se connecter';
  document.getElementById('toggleAuthMode').textContent = authMode === 'signup' ? 'Déjà un compte ? Se connecter' : 'Pas encore de compte ? Créer un compte';
  document.getElementById('loginSub').textContent = authMode === 'signup' ? 'Créer un compte' : 'Connexion sécurisée';
  document.getElementById('forgotPasswordLink').style.display = authMode === 'signup' ? 'none' : 'block';
  document.getElementById('loginNameField').style.display = authMode === 'signup' ? 'block' : 'none';
  document.getElementById('loginName').required = authMode === 'signup';
  document.getElementById('loginError').textContent = '';
}
document.getElementById('toggleAuthMode').onclick = (e)=>{
  e.preventDefault();
  authMode = authMode === 'login' ? 'signup' : 'login';
  updateAuthModeUI();
};
updateAuthModeUI();

function authErrorMessage(code){
  switch(code){
    case 'auth/email-already-in-use': return "Un compte existe déjà avec cet email.";
    case 'auth/weak-password': return "Mot de passe trop court (6 caractères minimum).";
    case 'auth/invalid-email': return "Adresse email invalide.";
    case 'auth/user-not-found':
    case 'auth/wrong-password':
    case 'auth/invalid-credential': return "Email ou mot de passe incorrect.";
    case 'auth/too-many-requests': return "Trop de tentatives, réessaie dans quelques minutes.";
    default: return "Une erreur est survenue. Réessaie.";
  }
}

document.getElementById('loginForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const fullName = normalizeNameFormat(document.getElementById('loginName').value.trim());
  const errEl = document.getElementById('loginError');
  errEl.style.color = 'var(--rust)';
  errEl.textContent = '';

  if(!email.toLowerCase().endsWith(ALLOWED_EMAIL_DOMAIN)){
    errEl.textContent = `Réservé aux emails ${ALLOWED_EMAIL_DOMAIN}`;
    return;
  }
  if(authMode === 'signup' && !fullName){
    errEl.textContent = "Indique ton nom complet (Prénom NOM).";
    return;
  }

  const action = authMode === 'signup'
    ? auth.createUserWithEmailAndPassword(email, password).then(cred=>{
        return db.collection('directory').doc(cred.user.uid).set({
          name: fullName,
          nameKey: normalizeKey(fullName),
          email: email
        });
      })
    : auth.signInWithEmailAndPassword(email, password);

  action.catch(err=>{
    errEl.textContent = authErrorMessage(err.code);
  });
});

document.getElementById('forgotPasswordLink').onclick = (e)=>{
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const errEl = document.getElementById('loginError');
  if(!email){ errEl.style.color = 'var(--rust)'; errEl.textContent = "Indique ton email dans le champ ci-dessus d'abord."; return; }
  auth.sendPasswordResetEmail(email).then(()=>{
    errEl.style.color = 'var(--teal)';
    errEl.textContent = "Email de réinitialisation envoyé.";
  }).catch(()=>{
    errEl.style.color = 'var(--rust)';
    errEl.textContent = "Impossible d'envoyer l'email (vérifie l'adresse).";
  });
};

function loadLocalFallback(){
  if(firestoreReady) return; // Firestore a fini par répondre, pas besoin du secours local
  try{
    const uid = auth && auth.currentUser ? auth.currentUser.uid : null;
    if(!uid){ state.contacts = []; render(); return; }
    const raw = localStorage.getItem(STORAGE_KEY + '-' + uid);
    state.contacts = raw ? JSON.parse(raw) : [];
  }catch(e){
    state.contacts = [];
  }
  render();
}

async function persist(){
  if(applyingRemoteUpdate) return; // on ne renvoie pas ce qu'on vient de recevoir
  if(!docRef) return; // pas encore connecté
  const uid = auth.currentUser ? auth.currentUser.uid : null;
  if(uid) localStorage.setItem(STORAGE_KEY + '-' + uid, JSON.stringify(state.contacts)); // toujours garder une copie locale
  try{
    await docRef.set({ contacts: state.contacts, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  }catch(e){
    console.error("Sauvegarde cloud impossible", e);
    showToast("Sauvegarde cloud impossible — réessai automatique");
    setTimeout(persist, 3000);
  }
}

let toastTimer = null;
function showToast(msg, action){
  const t = document.getElementById('toast');
  clearTimeout(toastTimer);
  t.innerHTML = '';
  const msgSpan = document.createElement('span');
  msgSpan.textContent = msg;
  t.appendChild(msgSpan);
  if(action){
    const btn = document.createElement('button');
    btn.className = 'toast-undo';
    btn.textContent = action.label;
    btn.onclick = ()=>{
      action.onClick();
      t.classList.remove('show');
      clearTimeout(toastTimer);
    };
    t.appendChild(btn);
  }
  t.classList.add('show');
  toastTimer = setTimeout(()=>t.classList.remove('show'), action ? 6000 : 1600);
}

function initials(nom, prenom){
  const a = (prenom||'').trim()[0] || '';
  const b = (nom||'').trim()[0] || '';
  return (a+b).toUpperCase() || '?';
}

function isDueTodayOrOverdue(c){
  if(!c.rappel_date) return false;
  return c.rappel_date <= todayISO();
}

function normalizeName(nom, prenom){
  return `${nom||''} ${prenom||''}`
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // enlève les accents
    .replace(/\s+/g,' ').trim();
}

function findDuplicateGroups(){
  const byPhone = {}, byName = {};
  state.contacts.forEach(c=>{
    const phoneKey = (c.tel||'').replace(/\D/g,'');
    if(phoneKey.length >= 8){ (byPhone[phoneKey] = byPhone[phoneKey]||[]).push(c); }
    const nameKey = normalizeName(c.nom, c.prenom);
    if(nameKey.length > 2){ (byName[nameKey] = byName[nameKey]||[]).push(c); }
  });
  const groups = [];
  Object.values(byPhone).forEach(list=>{ if(list.length>1) groups.push({reason:'Même numéro de téléphone', contacts:list}); });
  Object.values(byName).forEach(list=>{ if(list.length>1) groups.push({reason:'Même nom', contacts:list}); });
  return groups;
}

function countDuplicateContacts(){
  const ids = new Set();
  findDuplicateGroups().forEach(g => g.contacts.forEach(c => ids.add(c.id)));
  return ids.size;
}

function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function rappelInfo(c){
  if(!c.rappel_date) return null;
  const today = todayISO();
  if(c.rappel_date < today) return {cls:'overdue', label:'En retard · ' + formatDateFr(c.rappel_date)};
  if(c.rappel_date === today) return {cls:'today', label:"Aujourd'hui"};
  return {cls:'upcoming', label: formatDateFr(c.rappel_date)};
}

function formatDateFr(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function formatTimestampFr(ms){
  const d = new Date(ms);
  const day = String(d.getDate()).padStart(2,'0');
  const month = String(d.getMonth()+1).padStart(2,'0');
  const year = d.getFullYear();
  const h = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${day}/${month}/${year} à ${h}h${min}`;
}

function normalizeNameFormat(str){
  if(!str) return '';
  return str.trim().split(/\s+/).map((word, i)=>{
    if(word.length === 0) return word;
    return i === 0
      ? word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
      : word.toUpperCase();
  }).join(' ');
}

function matchesSearch(c, q){
  if(!q) return true;
  q = q.toLowerCase();
  return [c.nom,c.prenom,c.ville,c.profession,c.reco,c.commentaires].join(' ').toLowerCase().includes(q);
}

function matchesFilters(c){
  if(state.filterDe.size > 0 && !state.filterDe.has(c.de || '')) return false;
  if(state.filterVille.size > 0 && !state.filterVille.has(c.ville || '')) return false;
  return true;
}

function sortContacts(list, isTodayView){
  // la vue "Aujourd'hui" reste toujours triée par urgence, quel que soit le
  // mode de tri choisi ailleurs — c'est tout l'intérêt de cette vue
  if(isTodayView){
    return list.sort((a,b)=>{
      const ar = a.rappel_date || '9999-99-99';
      const br = b.rappel_date || '9999-99-99';
      if(ar !== br) return ar.localeCompare(br);
      return (a.nom||'').localeCompare(b.nom||'');
    });
  }
  switch(state.sortMode){
    case 'nom':
      return list.sort((a,b)=>{
        const n = (a.nom||'').localeCompare(b.nom||'');
        return n !== 0 ? n : (a.prenom||'').localeCompare(b.prenom||'');
      });
    case 'de':
      return list.sort((a,b)=>{
        const ad = a.de || '';
        const bd = b.de || '';
        if(!ad && !bd) return (a.nom||'').localeCompare(b.nom||'');
        if(!ad) return 1; // sans binôme renvoyé en fin de liste
        if(!bd) return -1;
        const d = ad.localeCompare(bd);
        return d !== 0 ? d : (a.nom||'').localeCompare(b.nom||'');
      });
    case 'recent':
      return list.sort((a,b)=> getCreatedAt(b) - getCreatedAt(a));
    case 'ancien':
      return list.sort((a,b)=> getCreatedAt(a) - getCreatedAt(b));
    case 'rappel':
    default:
      return list.sort((a,b)=>{
        const ar = a.rappel_date || '9999-99-99';
        const br = b.rappel_date || '9999-99-99';
        if(ar !== br) return ar.localeCompare(br);
        return (a.nom||'').localeCompare(b.nom||'');
      });
  }
}

  items.forEach(c=>{
    const card = document.createElement('div');
    card.className = 'card' + (state.selectMode && state.selectedIds.has(c.id) ? ' selected' : '');
    const telHref = (c.tel||'').replace(/\s+/g,'');

        </div>
        <div class="profession">${escapeHtml(c.profession||'')}${isTodayView ? ` · <span style="color:var(--ink-soft)">${escapeHtml(c.statut)}</span>` : ''}${(state.sortMode==='de' && c.de) ? ` · <span style="color:var(--ink-soft)">DE ${escapeHtml(c.de)}</span>` : ''}</div>
        ${c.tel ? `<a class="phone-line" href="tel:${telHref}" onclick="event.stopPropagation()">📞 ${escapeHtml(c.tel)}</a>` : ''}
        ${c.reco ? `<div class="reco">↳ reco. ${escapeHtml(c.reco)}</div>` : ''}
        ${c.commentaires ? `<div class="comment">${escapeHtml(c.commentaires)}</div>` : ''}
        ${ri ? `<div class="rappel-badge ${ri.cls}">⏰ ${ri.label}${c.rappel_note ? ' · ' + escapeHtml(c.rappel_note) : ''}</div>` : ''}
      </div>
      ${(c.tel && !state.selectMode) ? `<a class="call-btn" href="tel:${telHref}" onclick="event.stopPropagation()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>

function escapeHtml(s){
  if(!s) return '';
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderDashboard(){
  const total = state.contacts.length;
  const bar = document.getElementById('dashBar');
  const legend = document.getElementById('dashLegend');
  const summary = document.getElementById('dashSummary');

  if(total === 0){
    summary.textContent = 'Aucun contact';
    bar.innerHTML = '';
    legend.innerHTML = '';
    return;
  }

  const signedCount = state.contacts.filter(c=>c.statut==='Signé').length;
  const rate = Math.round((signedCount/total)*100);
  summary.innerHTML = `<strong>${signedCount}</strong> signés sur <strong>${total}</strong> (${rate}%)`;

  bar.innerHTML = '';
  legend.innerHTML = '';
  STATUSES.forEach(s=>{
    const count = state.contacts.filter(c=>c.statut===s).length;
    if(count === 0) return;
    const pct = (count/total*100).toFixed(2);
    const color = STATUS_HEX[s] || '#999';

    const seg = document.createElement('div');
    seg.className = 'dash-seg';
    seg.style.width = pct + '%';
    seg.style.background = color;
    seg.title = `${s} : ${count}`;
    seg.onclick = ()=> switchTab(s);
    bar.appendChild(seg);

    const item = document.createElement('div');
    item.className = 'dash-legend-item';
    item.innerHTML = `<span class="dash-legend-dot" style="background:${color}"></span>${s} · ${count}`;
    item.onclick = ()=> switchTab(s);
    legend.appendChild(item);
  });
}

  // détection de doublon avant sauvegarde (même téléphone ou même nom, en
  // excluant la fiche qu'on est en train d'éditer)
  const phoneKey = (data.tel||'').replace(/\D/g,'');
  const nameKey = normalizeName(data.nom, data.prenom);
  const potentialDupe = state.contacts.find(c=>{
    if(c.id === state.editingId) return false;
    const samePhone = phoneKey.length >= 8 && (c.tel||'').replace(/\D/g,'') === phoneKey;
    const sameName = nameKey.length > 2 && normalizeName(c.nom, c.prenom) === nameKey;
    return samePhone || sameName;
  });
  if(potentialDupe){
    const proceed = confirm(`Un contact ressemblant existe déjà : ${potentialDupe.prenom} ${potentialDupe.nom}${potentialDupe.tel ? ' (' + potentialDupe.tel + ')' : ''}.\n\nEnregistrer quand même ?`);
    if(!proceed) return;
  }

  const previousDe = state.editingId
    ? (state.contacts.find(c=>c.id===state.editingId) || {}).de
    : null;

  if(state.editingId){
    const idx = state.contacts.findIndex(c=>c.id===state.editingId);
    const old = state.contacts[idx];
    const historique = Array.isArray(old.historique) ? [...old.historique] : [];
    if(old.statut !== data.statut){
      historique.push({ date: Date.now(), from: old.statut, to: data.statut });
    }
    state.contacts[idx] = {...old, ...data, historique};
    showToast("Contact mis à jour");
  } else {
    const nextId = state.contacts.length ? Math.max(...state.contacts.map(c=>c.id))+1 : 1;
    const historique = [{ date: Date.now(), from: null, to: data.statut }];
    state.contacts.push({ id: nextId, createdAt: Date.now(), ...data, historique });
    showToast("Contact ajouté");
  }
  // reste sur la vue "Aujourd'hui" si c'est là qu'on travaillait, sinon bascule
  // vers l'onglet du statut sauvegardé
  if(state.activeStatus !== '__TODAY__'){
    state.activeStatus = pickedStatus;
  }
  persist();
  closeSheet();
  render();

  // partage automatique avec le binôme, si le champ DE a été renseigné/modifié
  if(data.de && data.de !== previousDe){
    shareContactWithBinome(data, data.de).then(result=>{
      if(result.shared){
        showToast(`Contact partagé avec ${result.name}`);
      } else if(result.reason === 'not_found'){
        showToast(`"${data.de}" introuvable — le contact n'a pas encore de compte Recos`);
      }
    });
  }
};

document.getElementById('deleteBtn').onclick = async ()=>{

  const deletedContact = state.contacts.find(c=>c.id === state.editingId);

  state.contacts = state.contacts.filter(c=>c.id !== state.editingId);
  persist();
  closeSheet();
  render();
  showToast("Contact supprimé", {
    label: "Annuler",
    onClick: ()=>{
      state.contacts.splice(deletedIndex, 0, deletedContact);

      render();
      showToast("Contact restauré");
    }
  });

async function exportToExcel(){
  await ensureXLSXLoaded().catch(()=>{});
  if(typeof XLSX === 'undefined'){
    showToast("Export indisponible (connexion requise la 1ère fois)");
    return;
  }
  const rows = [...state.contacts]
    .sort((a,b)=> (a.nom||'').localeCompare(b.nom||''))
    .map(c => ({
      "Nom": c.nom || '',
      "Prénom": c.prenom || '',
      "Téléphone": c.tel || '',
      "Ville": c.ville || '',
      "Profession": c.profession || '',
      "Recommandé par": c.reco || '',
      "DE": c.de || '',
      "Statut": c.statut || '',
      "Date de rappel": c.rappel_date ? formatDateFr(c.rappel_date) : '',
      "Objet du rappel": c.rappel_note || '',
      "Commentaires": c.commentaires || ''
    }));

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [
    {wch:18},{wch:14},{wch:16},{wch:16},{wch:20},{wch:20},{wch:18},{wch:12},{wch:14},{wch:26},{wch:40}
  ];

}

// ---- IMPORT EXCEL (nouveaux prospects → statut "Contact") ----
const IMPORT_FIELD_CANDIDATES = {
  nom: ['nom','lastname','nomdefamille'],
  prenom: ['prenom','firstname'],
  tel: ['telephone','tel','numero','numerodetelephone','numerotel','portable','mobile'],
  ville: ['ville','city','commune'],
  profession: ['profession','metier','job','activite'],
  reco: ['recommandepar','reco','recommandation','parrain'],
  de: ['de','binome'],
  commentaires: ['commentaires','commentaire','notes','remarque','remarques']
};

function normalizeKey(s){
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
}

function buildImportColumnIndex(headerRow){
  const normalized = headerRow.map(h => normalizeKey(h));
  const idx = {};
  Object.entries(IMPORT_FIELD_CANDIDATES).forEach(([field, candidates])=>{
    const pos = normalized.findIndex(h => candidates.includes(h));
    if(pos !== -1) idx[field] = pos;
  });
  return idx;
}

document.getElementById('actionImport').onclick = ()=>{
  actionsOverlay.classList.remove('open');
  document.getElementById('importExcelInput').click();
};

document.getElementById('importExcelInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  e.target.value = ''; // permet de réimporter le même fichier plus tard si besoin
  if(!file) return;
  await ensureXLSXLoaded().catch(()=>{});
  if(typeof XLSX === 'undefined'){
    showToast("Import indisponible (connexion requise la 1ère fois)");
    return;
  }

  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});

      if(rows.length < 2){
        showToast("Fichier vide ou illisible");
        return;
      }

      const headerRow = rows[0].map(h => String(h));
      const idx = buildImportColumnIndex(headerRow);

      if(idx.nom === undefined && idx.prenom === undefined){
        showToast("Colonnes Nom / Prénom introuvables dans le fichier");
        return;
      }

      const get = (row, field) => idx[field] !== undefined ? String(row[idx[field]] ?? '').trim() : '';

      const imported = rows.slice(1)
        .filter(r => r.some(cell => String(cell).trim() !== ''))
        .map(r => ({
          nom: get(r,'nom'), prenom: get(r,'prenom'), tel: get(r,'tel'),
          ville: get(r,'ville'), profession: get(r,'profession'),
          reco: get(r,'reco'), de: normalizeNameFormat(get(r,'de')), commentaires: get(r,'commentaires')
        }))
        .filter(c => c.nom || c.prenom);

      if(imported.length === 0){
        showToast("Aucune ligne valide trouvée dans le fichier");
        return;
      }

      if(!confirm(`Importer ${imported.length} contact(s) dans "Contact" ?`)) return;

      let nextId = state.contacts.length ? Math.max(...state.contacts.map(c=>c.id))+1 : 1;
      const newContacts = imported.map(c => ({
        id: nextId++,
        createdAt: Date.now(),
        nom: c.nom, prenom: c.prenom, tel: c.tel, ville: c.ville,
        profession: c.profession, reco: c.reco, de: c.de, statut: 'Contact', commentaires: c.commentaires,
        historique: [{ date: Date.now(), from: null, to: 'Contact' }]
      }));
      state.contacts.push(...newContacts);
      persist();
      state.activeStatus = 'Contact';
      render();
      showToast(`${newContacts.length} contact(s) importé(s) dans "Contact"`);
    }catch(err){
      console.error("Erreur d'import Excel", err);
      showToast("Erreur lors de la lecture du fichier");
    }
  };
  reader.readAsArrayBuffer(file);
});

document.getElementById('bulkDeleteBtn').onclick = ()=>{

  const count = state.selectedIds.size;
  if(!confirm(`Supprimer ${count} contact(s) ?`)) return;
  const deletedContacts = state.contacts.filter(c=>state.selectedIds.has(c.id));
  state.contacts = state.contacts.filter(c=>!state.selectedIds.has(c.id));
  persist();
  exitSelectMode();
  render();
  showToast(`${deletedContacts.length} contact(s) supprimé(s)`, {
    label: "Annuler",
    onClick: ()=>{
      state.contacts.push(...deletedContacts);
      persist();
      render();
      showToast("Contacts restaurés");
    }
  });
};

function renderBulkStatusPicker(){
  const wrap = document.getElementById('bulkStatusPicker');
  wrap.innerHTML = '';
  STATUSES.forEach(s=>{
    const chip = document.createElement('div');
    chip.className = 'status-chip';
    chip.textContent = s;
    chip.onclick = ()=> applyBulkStatus(s);
    wrap.appendChild(chip);
  });
}

function applyBulkStatus(newStatus){
  const ids = [...state.selectedIds];
  ids.forEach(id=>{
    const idx = state.contacts.findIndex(c=>c.id===id);
    if(idx === -1) return;
    const c = state.contacts[idx];
    if(c.statut !== newStatus){
      const historique = Array.isArray(c.historique) ? [...c.historique] : [];
      historique.push({ date: Date.now(), from: c.statut, to: newStatus });
      state.contacts[idx] = {...c, statut: newStatus, historique};
    }
  });
  persist();
  document.getElementById('bulkStatusOverlay').classList.remove('open');
  exitSelectMode(true);
  render();
  showToast(`Statut mis à jour pour ${ids.length} contact(s)`);
}

};

let leafletMap = null;
let mapMarkersLayer = null;

function initMap(){
  if(leafletMap) return;
  leafletMap = L.map('mapView', {scrollWheelZoom:true}).setView([46.4, -0.5], 6.3);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 18
  }).addTo(leafletMap);
  mapMarkersLayer = L.layerGroup().addTo(leafletMap);
}

function renderMap(){
  const mapEl = document.getElementById('mapView');
  mapEl.classList.add('active');
  ensureLeafletLoaded().then(()=>{
    initMap();
    setTimeout(()=> leafletMap.invalidateSize(), 50);

    mapMarkersLayer.clearLayers();
    const byCity = {};
    state.contacts.forEach(c=>{
      if(!c.ville) return;
      if(!byCity[c.ville]) byCity[c.ville] = [];
      byCity[c.ville].push(c);
    });

    const bounds = [];
    Object.keys(byCity).forEach(ville=>{
      const coords = CITY_COORDS[ville];
      if(!coords) return;
      bounds.push(coords);
      const contacts = byCity[ville];
      const popupItems = contacts.slice(0,12).map(c=>
        `<div class="map-popup-item" onclick="openSheet(${c.id})"><b>${escapeHtml(c.prenom)} ${escapeHtml(c.nom)}</b><br>${escapeHtml(c.profession||'')} · ${escapeHtml(c.statut)}</div>`
      ).join('');
      const marker = L.circleMarker(coords, {
        radius: Math.min(8 + contacts.length, 20),
        fillColor: '#A9782F', color:'#7A5620', weight:1.5, fillOpacity:0.75
      });
      marker.bindPopup(`<b>${escapeHtml(ville)}</b> · ${contacts.length} contact${contacts.length>1?'s':''}<br>${popupItems}`);
      marker.addTo(mapMarkersLayer);
    });
    if(bounds.length) leafletMap.fitBounds(bounds, {padding:[30,30], maxZoom:9});
  }).catch(()=> showToast("Impossible de charger la carte (connexion requise la 1ère fois)"));
}

function hideMap(){
  document.getElementById('mapView').classList.remove('active');
}

function buildDupeCardHTML(c){
  const telHref = (c.tel||'').replace(/\s+/g,'');
  return `<div class="card" data-contact-id="${c.id}">
    <div class="avatar">${initials(c.nom,c.prenom)}</div>
    <div class="body">
      <div class="row1">
        <div class="name">${escapeHtml(c.prenom)} ${escapeHtml(c.nom)}</div>
        <div class="ville">${escapeHtml(c.ville||'')}</div>
      </div>
      <div class="profession">${escapeHtml(c.profession||'')} · <span style="color:var(--ink-soft)">${escapeHtml(c.statut)}</span></div>
      ${c.tel ? `<a class="phone-line" href="tel:${telHref}" onclick="event.stopPropagation()">📞 ${escapeHtml(c.tel)}</a>` : ''}
    </div>
  </div>`;
}

function renderDupes(){
  const el = document.getElementById('dupesView');
  el.classList.add('active');
  const groups = findDuplicateGroups();

  if(groups.length === 0){
    el.innerHTML = `<div class="empty">
      <div class="glyph">✓</div>
      <div class="display">Aucun doublon détecté</div>
      <div>Tous tes contacts semblent uniques (même nom ou même numéro).</div>
    </div>`;
    return;
  }

  el.innerHTML = groups.map(g => `
    <div class="dupe-group">
      <div class="dupe-group-header">⚠️ ${escapeHtml(g.reason)}</div>
      ${g.contacts.map(c => buildDupeCardHTML(c)).join('')}

  `).join('');

  el.querySelectorAll('[data-contact-id]').forEach(node=>{
    node.addEventListener('click', ()=> openSheet(Number(node.getAttribute('data-contact-id'))));
