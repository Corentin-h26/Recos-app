<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Recos</title>

<!-- PWA : installation en app sur iPhone / iPad / Mac / PC -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22303A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recos">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#F6F1E7;
    --paper-2:#EFE7D6;
    --ink:#22303A;
    --ink-soft:#5B6B72;
    --line: #D8CDB4;
    --brass:#A9782F;
    --brass-soft:#E4CE9E;
    --teal:#3F6B63;
    --teal-soft:#DCE7E2;
    --rust:#AD5A3F;
    --rust-soft:#F0DBD1;
    --slate:#6B7684;
    --slate-soft:#E4E6E7;
    --card-shadow: 0 1px 0 rgba(34,48,58,0.06), 0 6px 16px -10px rgba(34,48,58,0.35);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, #fffaf0 0%, var(--paper) 45%),
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom: 96px;
  }
  .display{font-family:'Fraunces', serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}

  /* HEADER */
  header{
    position:sticky; top:0; z-index:30;
    background: linear-gradient(180deg, var(--paper) 70%, rgba(246,241,231,0));
    padding: calc(18px + env(safe-area-inset-top)) 16px 10px;
  }
  .brand{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px; gap:8px;
  }
  .header-actions{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .brand h1{
    font-size: 26px; font-weight:600; letter-spacing:-0.01em; margin:0;
    display:flex; align-items:baseline; gap:8px;
  }
  .brand h1 .tally{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px; font-weight:500; color:var(--ink-soft);
    background:var(--paper-2); border:1px solid var(--line);
    padding:2px 8px; border-radius:20px;
  }
  .search-wrap{
    display:flex; align-items:center; gap:8px;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:9px 12px; box-shadow: inset 0 1px 2px rgba(34,48,58,0.04);
  }
  .search-wrap svg{flex:none; color:var(--ink-soft);}
  .search-wrap input{
    border:none; outline:none; background:transparent; width:100%;
    font-family:'IBM Plex Sans', sans-serif; font-size:15px; color:var(--ink);
  }
  .search-wrap input::placeholder{color:#A3ABA2;}

  .sort-row{
    display:flex; align-items:center; gap:8px; margin-top:8px; padding: 0 2px;
  }
  .sort-label{font-size:12.5px; color:var(--ink-soft); flex:none;}
  #sortSelect{
    font-family:'IBM Plex Sans', sans-serif; font-size:12.5px; color:var(--ink);
    background:var(--paper-2); border:1px solid var(--line); border-radius:20px;
    padding:5px 10px; -webkit-appearance:none; appearance:none; cursor:pointer;
  }

  /* TABS (rolodex) */
  .tabs{
    display:flex; gap:6px; overflow-x:auto; padding:14px 16px 4px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:none; display:flex; align-items:center; gap:6px;
    padding: 8px 13px 9px; border-radius: 10px 10px 4px 4px;
    font-size:13.5px; font-weight:500; color:var(--ink-soft);
    background:var(--paper-2); border:1px solid var(--line); border-bottom:3px solid var(--line);
    cursor:pointer; white-space:nowrap;
    transition: transform .12s ease;
  }
  .tab:active{transform: scale(0.97);}
  .tab .n{
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    background:rgba(34,48,58,0.08); padding:1px 6px; border-radius:20px;
  }
  .tab.active{
    background:#fff; color:var(--ink); border-color: var(--line);
    border-bottom:3px solid var(--brass);
    box-shadow: 0 2px 6px -2px rgba(34,48,58,0.2);
  }
  .tab.active .n{background:var(--brass-soft); color:#7A5620;}

  /* LIST */
  main{padding: 8px 16px 20px;}
  .empty{
    text-align:center; padding: 60px 20px; color:var(--ink-soft);
  }
  .empty .glyph{font-size:34px; margin-bottom:10px; opacity:.5;}
  .empty .display{font-size:19px; color:var(--ink); margin-bottom:4px;}

  .card{
    background:#fff; border:1px solid var(--line); border-radius: var(--radius);
    padding: 13px 14px; margin-bottom:10px; box-shadow: var(--card-shadow);
    display:flex; gap:12px; align-items:flex-start; cursor:pointer;
    transition: transform .1s ease;
  }
  .card:active{transform: scale(0.985);}
  .card .avatar{
    flex:none; width:40px; height:40px; border-radius:50%;
    background: var(--teal-soft); color:var(--teal);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:600; font-size:15px;
  }
  .card .body{min-width:0; flex:1;}
  .card .row1{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .card .name{font-weight:600; font-size:15.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card .ville{font-size:12px; color:var(--ink-soft); flex:none;}
  .card .profession{font-size:13px; color:var(--ink-soft); margin-top:1px;}
  .card .reco{
    font-size:12px; color:var(--brass); margin-top:5px;
    display:flex; align-items:center; gap:4px;
  }
  .card .comment{
    font-size:12.5px; color:var(--ink-soft); margin-top:5px;
    font-style:italic; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card .rappel-badge{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11.5px; font-weight:600; margin-top:6px;
    padding:3px 8px; border-radius:20px;
  }
  .card .rappel-badge.overdue{background:var(--rust-soft); color:var(--rust);}
  .card .rappel-badge.today{background:var(--brass-soft); color:#7A5620;}
  .card .rappel-badge.upcoming{background:var(--slate-soft); color:var(--slate);}
  .card .call-btn{
    flex:none; width:34px; height:34px; border-radius:50%;
    background:var(--teal-soft); color:var(--teal);
    display:flex; align-items:center; justify-content:center;
    text-decoration:none;
  }

  /* FAB */
  .fab{
    position:fixed; right:18px; bottom:calc(22px + env(safe-area-inset-bottom)); z-index:40;
    width:56px; height:56px; border-radius:50%;
    background:var(--ink); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 24px -8px rgba(34,48,58,0.55);
    border:none; cursor:pointer;
  }
  .fab:active{transform:scale(0.94);}

  /* SHEET */
  .overlay{
    position:fixed; inset:0; background:rgba(34,48,58,0.42);
    z-index:9999; display:flex; align-items:flex-end;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    background:var(--paper); width:100%; max-height:92vh; overflow-y:auto;
    border-radius: 20px 20px 0 0; padding: 8px 18px 26px;
    transform: translateY(20px); transition: transform .22s ease;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
  }
  .overlay.open .sheet{transform: translateY(0);}
  .sheet-handle{
    width:38px; height:4px; border-radius:4px; background:var(--line);
    margin: 10px auto 14px;
  }
  .sheet-title{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;
  }
  .sheet-title h2{font-size:20px; margin:0; font-weight:600;}
  .sheet-title button.close{
    background:none; border:none; color:var(--ink-soft); font-size:22px; cursor:pointer;
    line-height:1; padding:4px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--ink-soft); margin-bottom:5px; font-weight:600;
  }
  .field input, .field textarea{
    width:100%; border:1px solid var(--line); background:#fff; border-radius:10px;
    padding:10px 12px; font-size:15px; font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink); outline:none;
  }
  .field input:focus, .field textarea:focus{border-color:var(--teal);}
  .field textarea{resize:vertical; min-height:56px;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  .status-picker{display:flex; flex-wrap:wrap; gap:6px;}
  .status-chip{
    padding:7px 11px; border-radius:20px; font-size:12.5px; font-weight:500;
    border:1px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer;
  }
  .status-chip.sel{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .sheet-actions{
    display:flex; gap:10px; margin-top:18px;
  }
  .btn{
    flex:1; border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:600;
    cursor:pointer; font-family:'IBM Plex Sans', sans-serif;
  }
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:active{opacity:.85;}
  .btn-danger{background:var(--rust-soft); color:var(--rust);}
  .btn-danger:active{opacity:.85;}
  .btn-ghost{background:var(--paper-2); color:var(--ink); border:1px solid var(--line);}

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-20px);
    background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:30px;
    font-size:13px; z-index:10000; opacity:0; transition: all .25s ease; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* PHONE (visible + cliquable) */
  .card .phone-line{
    font-size:12.5px; color:var(--teal); margin-top:4px;
    display:flex; align-items:center; gap:4px; text-decoration:none;
  }
  .field .call-inline{
    display:flex; gap:8px; align-items:center;
  }
  .field .call-inline input{flex:1;}
  .call-inline-btn{
    flex:none; width:40px; height:40px; border-radius:10px;
    background:var(--teal-soft); color:var(--teal); display:flex; align-items:center; justify-content:center;
    text-decoration:none; border:1px solid var(--line);
  }

  /* NOTIFICATIONS */
  .notif-btn{
    flex:none; width:34px; height:34px; border-radius:50%;
    background:var(--paper-2); border:1px solid var(--line); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .notif-btn.on{background:var(--brass-soft); color:#7A5620; border-color:var(--brass-soft);}

  /* MAP TAB */
  #mapView{
    display:none; height: calc(100vh - 190px); min-height:400px;
    border-radius: var(--radius); overflow:hidden; border:1px solid var(--line);
    margin: 4px 16px 16px;
  }
  #mapView.active{display:block;}

  /* DOUBLONS */
  #dupesView{display:none; padding: 4px 16px 16px;}
  #dupesView.active{display:block;}
  .dupe-group{margin-bottom:20px;}
  .dupe-group-header{
    font-size:12.5px; font-weight:600; color:var(--rust); margin-bottom:8px;
    display:flex; align-items:center; gap:6px;
  }
  .dupe-group .card{border-color:var(--rust-soft); margin-bottom:8px;}
  .leaflet-popup-content{font-family:'IBM Plex Sans', sans-serif; font-size:13px;}
  .leaflet-popup-content b{font-family:'Fraunces', serif;}
  .map-popup-item{padding:3px 0; border-top:1px solid #eee; cursor:pointer;}
  .map-popup-item:hover{background:#F6F1E7;}
  .map-popup-item:first-of-type{border-top:none;}

  /* RESPONSIVE : iPad / Mac (écrans larges, souris/trackpad) */
  @media (min-width: 780px){
    body{padding-bottom: 40px;}
    header{
      max-width: 900px; margin: 0 auto; padding: 24px 24px 10px;
    }
    main{max-width: 900px; margin: 0 auto; padding: 8px 24px 32px;}
    .brand h1{font-size:30px;}
    .search-wrap{padding:11px 14px;}
    .search-wrap input{font-size:16px;}
    .tabs{
      flex-wrap: wrap; overflow-x: visible; padding: 16px 0 8px;
    }
    .tab{cursor:pointer;}
    .tab:hover{background:#fff; border-color:var(--ink-soft);}
    #list{
      display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; align-items:start;
    }
    .card{margin-bottom:0; cursor:pointer;}
    .card:hover{
      transform: translateY(-2px);
      box-shadow: 0 4px 14px -6px rgba(34,48,58,0.3), var(--card-shadow);
    }
    .fab{
      right: calc(50% - 450px + 24px); bottom:28px;
    }
    #mapView{max-width:900px; margin:4px auto 24px; height:560px;}
    .overlay{align-items:center; justify-content:center;}
    .sheet{
      max-width:520px; border-radius:20px; max-height:85vh;
    }
  }
  @media (min-width: 1100px){
    header, main, #mapView{max-width:1080px;}
    #list{grid-template-columns: repeat(3, 1fr);}
    .fab{right: calc(50% - 540px + 24px);}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Recos <span class="tally" id="tally">…</span></h1>
    <div class="header-actions">
      <button class="notif-btn" id="notifBtn" title="Activer les notifications de rappel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <button class="notif-btn" id="syncRemindersBtn" title="Copier la liste des rappels pour Rappels iPhone">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </button>
      <button class="notif-btn" id="exportExcelBtn" title="Exporter en Excel (sauvegarde)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>
  </div>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="text" placeholder="Chercher un nom, une ville, une reco…">
    <svg id="searchClear" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none; cursor:pointer; flex:none;"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
  </div>
  <div class="sort-row">
    <span class="sort-label">Trier :</span>
    <select id="sortSelect">
      <option value="rappel">Rappel (défaut)</option>
      <option value="nom">Nom (A → Z)</option>
      <option value="recent">Ajout : plus récent</option>
      <option value="ancien">Ajout : plus ancien</option>
    </select>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main id="list"></main>
<div id="mapView"></div>
<div id="dupesView"></div>

<button class="fab" id="fabAdd" aria-label="Ajouter">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">
      <h2 id="sheetTitle" class="display">Nouveau contact</h2>
      <button class="close" id="closeSheet">&times;</button>
    </div>

    <div class="two-col">
      <div class="field"><label>Nom</label><input id="f_nom" type="text" autocomplete="off"></div>
      <div class="field"><label>Prénom</label><input id="f_prenom" type="text" autocomplete="off"></div>
    </div>
    <div class="field">
      <label>Téléphone</label>
      <div class="call-inline">
        <input id="f_tel" type="tel" autocomplete="off">
        <a class="call-inline-btn" id="callInlineBtn" href="#" title="Appeler">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </a>
      </div>
    </div>
    <div class="two-col">
      <div class="field"><label>Ville</label><input id="f_ville" type="text" autocomplete="off"></div>
      <div class="field"><label>Profession</label><input id="f_profession" type="text" autocomplete="off"></div>
    </div>
    <div class="field"><label>Recommandé par</label><input id="f_reco" type="text" autocomplete="off"></div>
    <div class="field">
      <label>Date de rappel</label>
      <input id="f_rappel_date" type="date">
    </div>
    <div class="field">
      <label>Objet du rappel</label>
      <input id="f_rappel_note" type="text" placeholder="Ex : rappeler pour proposer un rdv" autocomplete="off">
    </div>
    <div class="field"><label>Commentaires</label><textarea id="f_commentaires"></textarea></div>
    <div class="field">
      <label>Statut</label>
      <div class="status-picker" id="statusPicker"></div>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-danger" id="deleteBtn" style="display:none;">Supprimer</button>
      <button class="btn btn-primary" id="saveBtn">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STATUSES = ["Contact","Rappeler","RDV posé","R1 fait","R2 fait","R3 fait","Signé","Refus","Client perdu"];
const STATUS_COLORS = {
  "Contact":"slate", "Rappeler":"rust", "RDV posé":"teal", "R1 fait":"teal",

let firestoreReady = false;
let applyingRemoteUpdate = false;

function loadData(){
  if(typeof firebase === 'undefined'){
    // le SDK Firebase n'a pas pu se charger (bloqué par le réseau/l'aperçu) :
    // on bascule directement sur la copie locale pour ne pas laisser l'écran vide
    console.error("Firebase SDK non chargé");
    showToast("Mode hors-ligne (Firebase indisponible)");
    loadLocalFallback();
    return;
  }
  auth.signInAnonymously().catch(err=>{
    console.error("Connexion Firebase impossible", err);
    showToast("Connexion cloud impossible — mode hors-ligne");
    loadLocalFallback();
  });

  // si Firestore ne répond pas assez vite (pas de réseau, etc.), on affiche
  // quand même les données locales pour ne pas laisser l'écran vide
  setTimeout(loadLocalFallback, 4000);

  auth.onAuthStateChanged(user=>{
    if(!user) return;
    // écoute en temps réel : toute modif sur un autre appareil arrive ici automatiquement
    docRef.onSnapshot(snap=>{
      firestoreReady = true;
      if(snap.exists && snap.data().contacts){
        applyingRemoteUpdate = true;
        state.contacts = snap.data().contacts;
        applyingRemoteUpdate = false;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.contacts)); // copie hors-ligne
        render();
        updateNotifBtnUI();
        checkDueNotifications();
      } else {
        // première utilisation : on amorce avec les données de départ
        state.contacts = SEED;
        persist();
        render();
      }
    }, err=>{
      console.error("Erreur de synchronisation Firebase", err);
      showToast("Synchronisation interrompue — mode hors-ligne");
      loadLocalFallback();
    });
  });
}

function loadLocalFallback(){
  if(firestoreReady) return; // Firestore a fini par répondre, pas besoin du secours local
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state.contacts = raw ? JSON.parse(raw) : SEED;
  }catch(e){
    state.contacts = SEED;
  }
  render();
}

async function persist(){
  if(applyingRemoteUpdate) return; // on ne renvoie pas ce qu'on vient de recevoir
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.contacts)); // toujours garder une copie locale
  try{
    await docRef.set({ contacts: state.contacts, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  }catch(e){
    console.error("Sauvegarde cloud impossible", e);
    showToast("Sauvegarde cloud impossible — réessai automatique");
    setTimeout(persist, 3000);
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function initials(nom, prenom){
  const a = (prenom||'').trim()[0] || '';
  const b = (nom||'').trim()[0] || '';
  return (a+b).toUpperCase() || '?';
}

function isDueTodayOrOverdue(c){
  if(!c.rappel_date) return false;
  return c.rappel_date <= todayISO();
}

function normalizeName(nom, prenom){
  return `${nom||''} ${prenom||''}`
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // enlève les accents
    .replace(/\s+/g,' ').trim();
}

function findDuplicateGroups(){
  const byPhone = {}, byName = {};
  state.contacts.forEach(c=>{
    const phoneKey = (c.tel||'').replace(/\D/g,'');
    if(phoneKey.length >= 8){ (byPhone[phoneKey] = byPhone[phoneKey]||[]).push(c); }
    const nameKey = normalizeName(c.nom, c.prenom);
    if(nameKey.length > 2){ (byName[nameKey] = byName[nameKey]||[]).push(c); }
  });
  const groups = [];
  Object.values(byPhone).forEach(list=>{ if(list.length>1) groups.push({reason:'Même numéro de téléphone', contacts:list}); });
  Object.values(byName).forEach(list=>{ if(list.length>1) groups.push({reason:'Même nom', contacts:list}); });
  return groups;
}

function countDuplicateContacts(){
  const ids = new Set();
  findDuplicateGroups().forEach(g => g.contacts.forEach(c => ids.add(c.id)));
  return ids.size;
}

function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function rappelInfo(c){
  if(!c.rappel_date) return null;
  const today = todayISO();
  if(c.rappel_date < today) return {cls:'overdue', label:'En retard · ' + formatDateFr(c.rappel_date)};
  if(c.rappel_date === today) return {cls:'today', label:"Aujourd'hui"};
  return {cls:'upcoming', label: formatDateFr(c.rappel_date)};
}

function formatDateFr(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function matchesSearch(c, q){
  if(!q) return true;
  q = q.toLowerCase();
  return [c.nom,c.prenom,c.ville,c.profession,c.reco,c.commentaires].join(' ').toLowerCase().includes(q);
}

function sortContacts(list, isTodayView){
  // la vue "Aujourd'hui" reste toujours triée par urgence, quel que soit le
  // mode de tri choisi ailleurs — c'est tout l'intérêt de cette vue
  if(isTodayView){
    return list.sort((a,b)=>{
      const ar = a.rappel_date || '9999-99-99';
      const br = b.rappel_date || '9999-99-99';
      if(ar !== br) return ar.localeCompare(br);
      return (a.nom||'').localeCompare(b.nom||'');
    });
  }
  switch(state.sortMode){
    case 'nom':
      return list.sort((a,b)=>{
        const n = (a.nom||'').localeCompare(b.nom||'');
        return n !== 0 ? n : (a.prenom||'').localeCompare(b.prenom||'');
      });
    case 'recent':
      return list.sort((a,b)=> getCreatedAt(b) - getCreatedAt(a));
    case 'ancien':
      return list.sort((a,b)=> getCreatedAt(a) - getCreatedAt(b));
    case 'rappel':
    default:
      return list.sort((a,b)=>{
        const ar = a.rappel_date || '9999-99-99';
        const br = b.rappel_date || '9999-99-99';
        if(ar !== br) return ar.localeCompare(br);
        return (a.nom||'').localeCompare(b.nom||'');
      });
  }
}

function renderList(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  const isTodayView = state.activeStatus === '__TODAY__';
  const items = sortContacts(
    state.contacts.filter(c => (isTodayView ? isDueTodayOrOverdue(c) : c.statut === state.activeStatus) && matchesSearch(c, state.search)),
    isTodayView
  );

  if(items.length === 0){
    const emptyMsg = isTodayView ? "Aucun rappel en attente. Bien joué !" : "Rien ici pour l'instant";
    const emptySub = isTodayView ? "Les contacts avec une date de rappel dépassée ou du jour apparaîtront ici." : 'Ajoutez un contact avec le bouton +.';
    list.innerHTML = `<div class="empty">
      <div class="glyph">${state.search ? '🔍' : '✦'}</div>
      <div class="display">${state.search ? 'Aucun résultat' : emptyMsg}</div>
      <div>${state.search ? 'Essayez un autre terme de recherche.' : emptySub}</div>
    </div>`;
    return;
  }

  items.forEach(c=>{
    const card = document.createElement('div');
    card.className = 'card';
    const telHref = (c.tel||'').replace(/\s+/g,'');
    const ri = rappelInfo(c);
    card.innerHTML = `
      <div class="avatar">${initials(c.nom,c.prenom)}</div>
      <div class="body">
        <div class="row1">
          <div class="name">${escapeHtml(c.prenom)} ${escapeHtml(c.nom)}</div>
          <div class="ville">${escapeHtml(c.ville||'')}</div>
        </div>
        <div class="profession">${escapeHtml(c.profession||'')}${isTodayView ? ` · <span style="color:var(--ink-soft)">${escapeHtml(c.statut)}</span>` : ''}</div>
        ${c.tel ? `<a class="phone-line" href="tel:${telHref}" onclick="event.stopPropagation()">📞 ${escapeHtml(c.tel)}</a>` : ''}
        ${c.reco ? `<div class="reco">↳ reco. ${escapeHtml(c.reco)}</div>` : ''}
        ${c.commentaires ? `<div class="comment">${escapeHtml(c.commentaires)}</div>` : ''}
        ${ri ? `<div class="rappel-badge ${ri.cls}">⏰ ${ri.label}${c.rappel_note ? ' · ' + escapeHtml(c.rappel_note) : ''}</div>` : ''}
      </div>
      ${c.tel ? `<a class="call-btn" href="tel:${telHref}" onclick="event.stopPropagation()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </a>` : ''}
    `;
    card.onclick = ()=> openSheet(c.id);
    list.appendChild(card);
  });
}

function escapeHtml(s){
  if(!s) return '';
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function render(){
  renderTabs();
  renderTally();
  const sortRow = document.querySelector('.sort-row');

  if(state.activeStatus === '__MAP__'){
    document.getElementById('list').style.display = 'none';
    document.querySelector('.fab').style.display = 'none';
    sortRow.style.display = 'none';
    hideDupes();
    renderMap();
  } else if(state.activeStatus === '__DUPES__'){
    document.getElementById('list').style.display = 'none';
    document.querySelector('.fab').style.display = 'none';
    sortRow.style.display = 'none';
    hideMap();

    document.getElementById('list').style.display = '';
    document.querySelector('.fab').style.display = 'flex';
    sortRow.style.display = state.activeStatus === '__TODAY__' ? 'none' : 'flex';
    hideMap();
    hideDupes();
    renderList();
  }
}

function openSheet(id){
  if(leafletMap) leafletMap.closePopup();
  state.editingId = id || null;
  const c = id ? state.contacts.find(x=>x.id===id) : null;

  document.getElementById('sheetTitle').textContent = c ? `${c.prenom} ${c.nom}` : 'Nouveau contact';
  document.getElementById('f_nom').value = c ? c.nom : '';
  document.getElementById('f_prenom').value = c ? c.prenom : '';
  document.getElementById('f_tel').value = c ? c.tel : '';
  updateCallInlineBtn();
  document.getElementById('f_ville').value = c ? c.ville : '';
  document.getElementById('f_profession').value = c ? c.profession : '';
  document.getElementById('f_reco').value = c ? c.reco : '';
  document.getElementById('f_rappel_date').value = c ? (c.rappel_date || '') : '';
  document.getElementById('f_rappel_note').value = c ? (c.rappel_note || '') : '';
  document.getElementById('f_commentaires').value = c ? c.commentaires : '';
  pickedStatus = c ? c.statut : (state.activeStatus === '__TODAY__' ? 'Contact' : state.activeStatus);
  renderStatusPicker();

  document.getElementById('deleteBtn').style.display = c ? 'block' : 'none';
  overlay.classList.add('open');
}

}

document.getElementById('saveBtn').onclick = async ()=>{
  const nom = document.getElementById('f_nom').value.trim();
  const prenom = document.getElementById('f_prenom').value.trim();
  if(!nom && !prenom){
    showToast("Merci d'indiquer au moins un nom");
    return;
  }
  const data = {
    nom, prenom,
    tel: document.getElementById('f_tel').value.trim(),
    ville: document.getElementById('f_ville').value.trim(),
    profession: document.getElementById('f_profession').value.trim(),
    reco: document.getElementById('f_reco').value.trim(),
    rappel_date: document.getElementById('f_rappel_date').value || null,
    rappel_note: document.getElementById('f_rappel_note').value.trim(),
    commentaires: document.getElementById('f_commentaires').value.trim(),
    statut: pickedStatus
  };

  // détection de doublon avant sauvegarde (même téléphone ou même nom, en
  // excluant la fiche qu'on est en train d'éditer)
  const phoneKey = (data.tel||'').replace(/\D/g,'');
  const nameKey = normalizeName(data.nom, data.prenom);
  const potentialDupe = state.contacts.find(c=>{
    if(c.id === state.editingId) return false;
    const samePhone = phoneKey.length >= 8 && (c.tel||'').replace(/\D/g,'') === phoneKey;
    const sameName = nameKey.length > 2 && normalizeName(c.nom, c.prenom) === nameKey;
    return samePhone || sameName;
  });
  if(potentialDupe){
    const proceed = confirm(`Un contact ressemblant existe déjà : ${potentialDupe.prenom} ${potentialDupe.nom}${potentialDupe.tel ? ' (' + potentialDupe.tel + ')' : ''}.\n\nEnregistrer quand même ?`);
    if(!proceed) return;
  }

  if(state.editingId){
    const idx = state.contacts.findIndex(c=>c.id===state.editingId);
    state.contacts[idx] = {...state.contacts[idx], ...data};
    showToast("Contact mis à jour");
  } else {
    const nextId = state.contacts.length ? Math.max(...state.contacts.map(c=>c.id))+1 : 1;
    state.contacts.push({ id: nextId, createdAt: Date.now(), ...data });
    showToast("Contact ajouté");
  }
  // reste sur la vue "Aujourd'hui" si c'est là qu'on travaillait, sinon bascule
  // vers l'onglet du statut sauvegardé
  if(state.activeStatus !== '__TODAY__'){
    state.activeStatus = pickedStatus;
  }
  persist();
  closeSheet();
  render();
};

document.getElementById('deleteBtn').onclick = async ()=>{
  if(!state.editingId) return;
  if(!confirm('Supprimer ce contact ?')) return;
  state.contacts = state.contacts.filter(c=>c.id !== state.editingId);
  persist();
  closeSheet();
  render();
  showToast("Contact supprimé");
};

// ---- NOTIFICATIONS (best effort : marche si l'app reste ouverte dans un onglet) ----
const NOTIF_KEY = 'recos-notif-enabled';
const notifBtn = document.getElementById('notifBtn');

function updateNotifBtnUI(){
  const enabled = localStorage.getItem(NOTIF_KEY) === '1' && Notification.permission === 'granted';
  notifBtn.classList.toggle('on', enabled);
}

async function toggleNotifications(){
  if(!('Notification' in window)){
    showToast("Notifications non disponibles sur ce navigateur");
    return;
  }
  if(Notification.permission !== 'granted'){
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      showToast("Notifications refusées");
      return;
    }
  }
  const currentlyOn = localStorage.getItem(NOTIF_KEY) === '1';
  localStorage.setItem(NOTIF_KEY, currentlyOn ? '0' : '1');
  updateNotifBtnUI();
  showToast(currentlyOn ? "Notifications désactivées" : "Notifications activées (tant que l'app reste ouverte)");
  if(!currentlyOn) checkDueNotifications();
}
notifBtn.onclick = toggleNotifications;

document.getElementById('syncRemindersBtn').onclick = ()=>{
  const withDates = state.contacts
    .filter(c => c.rappel_date)
    .sort((a,b)=> a.rappel_date.localeCompare(b.rappel_date));

  if(withDates.length === 0){
    showToast("Aucune date de rappel enregistrée pour l'instant");
    return;
  }

  const lines = withDates.map(c =>
    `${c.prenom} ${c.nom} — ${formatDateFr(c.rappel_date)}${c.rappel_note ? ' — ' + c.rappel_note : ''}${c.tel ? ' — ' + c.tel : ''}`
  );
  const text = "Crée-moi ces rappels dans mon app Rappels :\n" + lines.join('\n');

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      showToast("Liste copiée — colle-la à Claude dans le chat");
    }).catch(()=>{
      showManualCopyPrompt(text);
    });
  } else {
    showManualCopyPrompt(text);
  }
};

function showManualCopyPrompt(text){
  window.prompt("Copie ce texte et colle-le à Claude dans le chat :", text);
}

const notifiedToday = new Set();
function checkDueNotifications(){
  if(localStorage.getItem(NOTIF_KEY) !== '1') return;
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const due = state.contacts.filter(isDueTodayOrOverdue);
  due.forEach(c=>{
    const key = c.id + '-' + todayISO();
    if(notifiedToday.has(key)) return;
    notifiedToday.add(key);
    new Notification('Rappel : ' + c.prenom + ' ' + c.nom, {
      body: (c.ville ? c.ville + ' · ' : '') + (c.profession || ''),
      tag: 'reco-' + c.id
    });
  });
}
// vérifie au chargement et toutes les 30 min si l'app reste ouverte
setInterval(checkDueNotifications, 30*60*1000);

  "Périgueux":[45.1848,0.7217], "Rouen":[49.4432,1.0999], "Royan":[45.6280,-1.0280],
  "Sable d'Olonne":[46.4966,-1.7833], "Sainte-Soulle":[46.2167,-1.0333], "Saintes":[45.7467,-0.6333],
  "Toulouse":[43.6047,1.4442], "Vaux-Sur-Mer":[45.6367,-1.0533], "Vix":[46.3667,-0.8667]
};

let leafletMap = null;
let mapMarkersLayer = null;

function initMap(){
  if(leafletMap) return;
  leafletMap = L.map('mapView', {scrollWheelZoom:true}).setView([46.4, -0.5], 6.3);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 18
  }).addTo(leafletMap);
  mapMarkersLayer = L.layerGroup().addTo(leafletMap);
}

function renderMap(){
  const mapEl = document.getElementById('mapView');
  mapEl.classList.add('active');
  initMap();
  setTimeout(()=> leafletMap.invalidateSize(), 50);

  mapMarkersLayer.clearLayers();
  const byCity = {};
  state.contacts.forEach(c=>{
    if(!c.ville) return;
    if(!byCity[c.ville]) byCity[c.ville] = [];
    byCity[c.ville].push(c);
  });

  const bounds = [];
  Object.keys(byCity).forEach(ville=>{
    const coords = CITY_COORDS[ville];
    if(!coords) return;
    bounds.push(coords);
    const contacts = byCity[ville];
    const popupItems = contacts.slice(0,12).map(c=>
      `<div class="map-popup-item" onclick="openSheet(${c.id})"><b>${escapeHtml(c.prenom)} ${escapeHtml(c.nom)}</b><br>${escapeHtml(c.profession||'')} · ${escapeHtml(c.statut)}</div>`
    ).join('');
    const marker = L.circleMarker(coords, {
      radius: Math.min(8 + contacts.length, 20),
      fillColor: '#A9782F', color:'#7A5620', weight:1.5, fillOpacity:0.75
    });
    marker.bindPopup(`<b>${escapeHtml(ville)}</b> · ${contacts.length} contact${contacts.length>1?'s':''}<br>${popupItems}`);
    marker.addTo(mapMarkersLayer);
  });
  if(bounds.length) leafletMap.fitBounds(bounds, {padding:[30,30], maxZoom:9});
}

function hideMap(){
  document.getElementById('mapView').classList.remove('active');
}

function buildDupeCardHTML(c){
  const telHref = (c.tel||'').replace(/\s+/g,'');
  return `<div class="card" data-contact-id="${c.id}">
    <div class="avatar">${initials(c.nom,c.prenom)}</div>
    <div class="body">
      <div class="row1">
        <div class="name">${escapeHtml(c.prenom)} ${escapeHtml(c.nom)}</div>
        <div class="ville">${escapeHtml(c.ville||'')}</div>
      </div>
      <div class="profession">${escapeHtml(c.profession||'')} · <span style="color:var(--ink-soft)">${escapeHtml(c.statut)}</span></div>
      ${c.tel ? `<a class="phone-line" href="tel:${telHref}" onclick="event.stopPropagation()">📞 ${escapeHtml(c.tel)}</a>` : ''}
    </div>
  </div>`;
}

function renderDupes(){
  const el = document.getElementById('dupesView');
  el.classList.add('active');
  const groups = findDuplicateGroups();

  if(groups.length === 0){
    el.innerHTML = `<div class="empty">
      <div class="glyph">✓</div>
      <div class="display">Aucun doublon détecté</div>
      <div>Tous tes contacts semblent uniques (même nom ou même numéro).</div>
    </div>`;
    return;
  }

  el.innerHTML = groups.map(g => `
    <div class="dupe-group">
      <div class="dupe-group-header">⚠️ ${escapeHtml(g.reason)}</div>
      ${g.contacts.map(c => buildDupeCardHTML(c)).join('')}
    </div>
  `).join('');

  el.querySelectorAll('[data-contact-id]').forEach(node=>{
    node.addEventListener('click', ()=> openSheet(Number(node.getAttribute('data-contact-id'))));
  });
}

function hideDupes(){
  document.getElementById('dupesView').classList.remove('active');
}

loadData();

// enregistrement du service worker (installabilité + coquille hors-ligne)
// seulement utile quand l'app est servie via http(s), pas en fichier local
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
